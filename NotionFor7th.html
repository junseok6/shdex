<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>근무 인수인계 · 일정관리</title>
<style>
/* ===== 색상 토큰 — 근무일지·군용지 팔레트 ===== */
:root{
  --bg:#EAE7D8;
  --bg-sidebar:#DEDAC3;
  --bg-hover:rgba(35,38,31,.055);
  --bg-active:rgba(35,38,31,.1);
  --bg-input:#F7F5EA;
  --bg-card:#F4F1E5;
  --text:#23261F;
  --text-dim:#565440;
  --text-faint:#7A765F;
  --border:#CFC9AE;
  --border-strong:#B3AC8B;
  --accent:#2E4A3B;
  --accent-soft:#DCE3D7;
  --red:#9C3730;      --red-bg:#EFDBD3;
  --orange:#8C5F1E;   --orange-bg:#EBDDBC;
  --yellow:#7C6A1B;   --yellow-bg:#EAE2B8;
  --green:#356B45;    --green-bg:#D9E6D6;
  --blue:#2E4F73;     --blue-bg:#D7E0E9;
  --gray:#66634E;     --gray-bg:#E1DCC5;
  --shadow:0 1px 2px rgba(35,38,31,.16);
  --radius:3px;
  --font-doc:'Batang','New Batang','HY Batang','Nanum Myeongjo','Noto Serif KR',BatangChe,'AppleMyungjo',serif;
  --font-ui:'Malgun Gothic','Apple SD Gothic Neo','Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI','맑은 고딕',Roboto,'Helvetica Neue',sans-serif;
  --font-mono:'Consolas','SF Mono',Menlo,'D2Coding','Courier New',monospace;
}
html[data-theme="dark"]{
  --bg:#15170F;
  --bg-sidebar:#1A1C13;
  --bg-hover:rgba(214,212,186,.06);
  --bg-active:rgba(214,212,186,.1);
  --bg-input:#1E2116;
  --bg-card:#1B1D14;
  --text:#E3E1CE;
  --text-dim:#AFAB8E;
  --text-faint:#77745D;
  --border:#33362A;
  --border-strong:#484B38;
  --accent:#83A987;
  --accent-soft:#233024;
  --red:#D68078;      --red-bg:#39221E;
  --orange:#D2A863;   --orange-bg:#382D19;
  --yellow:#D0C36E;   --yellow-bg:#312E17;
  --green:#8CBE8E;    --green-bg:#1F2F1F;
  --blue:#93B2CC;     --blue-bg:#1E2732;
  --gray:#ABA88C;     --gray-bg:#26281D;
  --shadow:0 1px 2px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-ui);
  font-size:15px; line-height:1.6; color:var(--text); background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--accent);text-decoration:none}
::selection{background:rgba(46,74,59,.22)}
/* 문서체 — 제목·본문 서식은 명조(바탕), 조작 UI는 돋움, 수치·시각은 고정폭 */
.page-title,h2.sec,h3.sub,.card-title,.modal-head,.ws-title,.cal-title,
.sign-box .nm,.order-body,.sec-num{
  font-family:var(--font-doc);
}
.sec-num{color:var(--accent);font-weight:700;margin-right:1px}

/* ===== 레이아웃 ===== */
.app{display:flex;height:100vh;overflow:hidden}

/* --- 사이드바 --- */
.sidebar{
  width:248px;flex:0 0 248px;background:var(--bg-sidebar);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  transition:margin-left .18s ease, background .18s ease;
}
.sidebar.hidden{margin-left:-248px}
.ws{
  display:flex;align-items:center;gap:9px;padding:12px 12px 10px;cursor:pointer;
  border-radius:var(--radius);margin:6px 8px 2px;
}
.ws:hover{background:var(--bg-hover)}
.ws-badge{
  width:26px;height:26px;flex:0 0 26px;border-radius:var(--radius);background:var(--accent);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;
  font-family:var(--font-doc);
}
.ws-caret svg{display:block}
.ws-text{min-width:0;flex:1}
.ws-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-sub{font-size:11.5px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-caret{color:var(--text-faint);font-size:11px}

.nav{padding:6px 8px;overflow-y:auto;flex:1}
.nav-label{
  font-size:11.5px;font-weight:600;color:var(--text-faint);letter-spacing:.02em;
  padding:14px 8px 4px;
}
.nav-item{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:5px 8px 5px 7px;border-radius:0 var(--radius) var(--radius) 0;color:var(--text-dim);
  font-size:14px;line-height:1.5;border-left:2px solid transparent;
}
.nav-item:hover{background:var(--bg-hover)}
.nav-item.on{background:var(--bg-active);color:var(--text);font-weight:600;border-left-color:var(--accent)}
.nav-item .cnt{
  margin-left:auto;font-size:11px;color:var(--text-faint);
  background:var(--bg-active);border-radius:9px;padding:0 6px;min-width:18px;text-align:center;
}
.nav-item .cnt.alert{background:var(--red-bg);color:var(--red);font-weight:600}
.nav-item .dot{
  margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 6px;
}
.sidebar-foot{padding:8px;border-top:1px solid var(--border);display:flex;gap:4px}
.sidebar-foot button{
  flex:1;padding:6px;border-radius:var(--radius);font-size:12px;color:var(--text-dim);
}
.sidebar-foot button:hover{background:var(--bg-hover)}

/* --- 본문 --- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{
  height:45px;flex:0 0 45px;display:flex;align-items:center;gap:8px;
  padding:0 14px;border-bottom:1px solid var(--border);background:var(--bg);
}
.topbar .crumb{font-size:14px;color:var(--text-dim);display:flex;align-items:center;gap:6px;min-width:0}
.topbar .crumb b{color:var(--text);font-weight:500}
.topbar .sep{color:var(--text-faint)}
.icon-btn{
  width:28px;height:28px;border-radius:var(--radius);display:flex;align-items:center;
  justify-content:center;color:var(--text-dim);font-size:15px;flex:0 0 28px;
}
.icon-btn:hover{background:var(--bg-hover)}
.next-ev{
  display:flex;align-items:center;gap:6px;padding:4px 10px;margin-left:10px;border-radius:var(--radius);
  border:1px solid var(--border);background:var(--bg-card);font-size:12.5px;color:var(--text-dim);
  max-width:340px;flex:0 1 auto;min-width:0;
}
.next-ev:hover{background:var(--bg-hover)}
.next-ev .next-ev-label{color:var(--text-faint);flex:0 0 auto}
.next-ev b{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.next-ev .faint{flex:0 0 auto}
.spacer{flex:1}
.content{flex:1;overflow-y:auto}
.page{max-width:860px;margin:0 auto;padding:40px 56px 120px}
.page.wide{max-width:1040px}

/* ===== 타이포 ===== */
.page-title{
  font-size:33px;line-height:1.3;font-weight:700;margin-bottom:8px;padding-bottom:14px;
  border-bottom:1px solid var(--border-strong);
}
.page-desc{color:var(--text-dim);font-size:14.5px;margin-bottom:26px}
h2.sec{
  font-size:19px;font-weight:600;
  margin:34px 0 12px;padding-top:22px;border-top:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
}
h2.sec:first-of-type{margin-top:12px;padding-top:0;border-top:none}
h2.sec.plain{padding-top:0;border-top:none}
h3.sub{font-size:15.5px;font-weight:600;margin:20px 0 8px;color:var(--text)}
.muted{color:var(--text-dim)}
.faint{color:var(--text-faint)}
.tiny{font-size:12px}
.small{font-size:13px}
.mono{font-variant-numeric:tabular-nums;font-family:var(--font-mono)}

/* ===== 컴포넌트 ===== */
.callout{
  padding:12px 15px;border-radius:var(--radius);background:var(--gray-bg);
  border-left:3px solid var(--border-strong);margin:14px 0;font-size:14px;
}
.callout.warn{background:var(--yellow-bg);color:var(--yellow);border-left-color:var(--yellow)}
.callout.danger{background:var(--red-bg);color:var(--red);border-left-color:var(--red)}
.callout.info{background:var(--blue-bg);color:var(--blue);border-left-color:var(--blue)}
.callout b{font-weight:600}

.card{
  border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card);
  padding:16px;margin-bottom:10px;
}
.card.click{cursor:pointer;transition:background .1s}
.card.click:hover{background:var(--bg-hover)}
.card-row{display:flex;align-items:flex-start;gap:12px}
.card-title{font-weight:600;font-size:15px;margin-bottom:3px;overflow-wrap:anywhere}
.card-meta{font-size:12.5px;color:var(--text-faint);display:flex;gap:10px;flex-wrap:wrap}

.grid{display:grid;gap:10px}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.grid.g4{grid-template-columns:repeat(4,1fr)}

.stat{border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;background:var(--bg-card)}
.stat .n{font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.stat .l{font-size:12.5px;color:var(--text-dim);margin-top:2px}
.stat.alert .n{color:var(--red)}
.stat.good .n{color:var(--green)}

.tag{
  display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;
  padding:1px 7px;border-radius:2px;background:var(--gray-bg);color:var(--gray);white-space:nowrap;
  border:1px solid var(--gray);
}
.tag.red{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.tag.orange{background:var(--orange-bg);color:var(--orange);border-color:var(--orange)}
.tag.yellow{background:var(--yellow-bg);color:var(--yellow);border-color:var(--yellow)}
.tag.green{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.tag.blue{background:var(--blue-bg);color:var(--blue);border-color:var(--blue)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:6px 12px;border-radius:var(--radius);border:1px solid var(--border-strong);
  background:var(--bg-card);font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;
}
.btn:hover{background:var(--bg-hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:var(--border-strong)}
.btn.danger:hover{background:var(--red-bg)}
.btn.ghost{border-color:transparent;background:none;color:var(--text-dim)}
.btn.ghost:hover{background:var(--bg-hover)}
.btn.big{padding:9px 18px;font-size:15px}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.field{margin-bottom:14px}
.field > label{display:block;font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:5px}
input[type=text],input[type=date],input[type=time],input[type=search],select,textarea{
  width:100%;padding:7px 10px;border:1px solid var(--border-strong);border-radius:var(--radius);
  background:var(--bg-input);outline:none;font-size:14px;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
textarea{resize:vertical;min-height:84px;line-height:1.65}
select{cursor:pointer}
.inline-input{
  border:1px solid transparent;background:none;padding:2px 6px;border-radius:4px;width:100%;
}
.inline-input:hover{background:var(--bg-hover)}
.inline-input:focus{background:var(--bg-input);border-color:var(--accent)}

.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--radius);overflow:hidden}
.seg button{padding:5px 12px;font-size:13.5px;color:var(--text-dim);border-right:1px solid var(--border)}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--bg-hover)}
.seg button.on{background:var(--accent);color:#fff}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:3px 10px;border-radius:14px;font-size:13px;color:var(--text-dim);border:1px solid var(--border)}
.chip:hover{background:var(--bg-hover)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}

/* 체크리스트 */
.check{display:flex;align-items:flex-start;gap:10px;padding:6px 8px;border-radius:4px}
.check:hover{background:var(--bg-hover)}
.check input[type=checkbox]{
  width:16px;height:16px;margin-top:5px;flex:0 0 16px;accent-color:var(--accent);cursor:pointer;
}
.check .txt{flex:1;min-width:0;padding-top:2px}
.check.done .txt > .t{color:var(--text-dim)}
.check .note{
  border:none;background:none;font-size:13px;color:var(--text-dim);padding:1px 4px;
  border-radius:3px;width:100%;margin-top:1px;
}
.check .note:hover{background:var(--bg-hover)}
.check .note:focus{background:var(--bg-input);box-shadow:0 0 0 1px var(--accent)}
.check .del{opacity:0;color:var(--text-faint);font-size:13px;padding:2px 6px;border-radius:4px}
.check:hover .del{opacity:1}
.check .del:hover{background:var(--bg-hover);color:var(--red)}

/* 리스트 행 */
.row{
  display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--border);
}
.row:hover{background:var(--bg-hover)}
.row .grow{flex:1;min-width:0}
.row .ttl{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ttl.done{text-decoration:line-through;color:var(--text-faint)}

.empty{
  text-align:center;padding:50px 20px;color:var(--text-faint);border:1px dashed var(--border-strong);
  border-radius:var(--radius);
}

.divider{height:1px;background:var(--border);margin:26px 0}

/* 달력 */
.cal-head{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.cal-title{font-size:18px;font-weight:600;letter-spacing:-.01em;min-width:118px;text-align:center}
.cal-grid{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.cal-wd,.cal-days{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-wd > div{
  padding:7px 0;text-align:center;font-size:12px;font-weight:600;color:var(--text-dim);
  background:var(--bg-sidebar);border-bottom:1px solid var(--border);
}
.cal-wd > div.sun{color:var(--red)}
.cal-wd > div.sat{color:var(--blue)}
.cal-cell{
  min-height:100px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);
  padding:5px 5px 7px;cursor:pointer;background:var(--bg-card);overflow:hidden;
}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell:hover{background:var(--bg-hover)}
.cal-cell.out{background:var(--bg-sidebar)}
.cal-d{
  font-size:12.5px;font-weight:500;width:21px;height:21px;display:flex;align-items:center;
  justify-content:center;border-radius:var(--radius);margin-bottom:3px;font-family:var(--font-mono);
}
.cal-cell.sun .cal-d{color:var(--red)}
.cal-cell.sat .cal-d{color:var(--blue)}
.cal-cell.out .cal-d{color:var(--text-faint)}   /* 지난달·다음달 날짜는 흐리게 */
.cal-cell.today .cal-d{background:var(--accent);color:#fff;font-weight:600}
.ev{
  font-size:11.5px;padding:1px 5px;border-radius:3px;margin-bottom:2px;line-height:1.6;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--gray-bg);color:var(--gray);
  cursor:pointer;
}
.ev:hover{filter:brightness(.92);text-decoration:line-through}
.ev.red{background:var(--red-bg);color:var(--red)}
.ev.orange{background:var(--orange-bg);color:var(--orange)}
.ev.yellow{background:var(--yellow-bg);color:var(--yellow)}
.ev.green{background:var(--green-bg);color:var(--green)}
.ev.blue{background:var(--blue-bg);color:var(--blue)}
.cal-more{font-size:11px;color:var(--text-faint);padding-left:3px}
.cal-lunar{font-size:10px;color:var(--text-faint);line-height:1.2;margin-left:4px;white-space:nowrap}
.cal-hol{font-size:10px;color:var(--red);font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-cell.holiday .cal-d{color:var(--red) !important}
.cal-todo{font-size:10.5px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px;border-radius:2px}
.cal-todo.done{text-decoration:line-through;color:var(--text-faint)}
.todo-row{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--border)}
.todo-row:last-of-type{border-bottom:none}
.todo-row input[type=checkbox]{width:16px;height:16px;flex:0 0 16px;accent-color:var(--accent);cursor:pointer}
.todo-row .todo-text{flex:1;min-width:0;font-size:14px}
.todo-row .todo-text.done{text-decoration:line-through;color:var(--text-faint)}
.todo-row .todo-del{color:var(--text-faint);font-size:12px;padding:2px 6px;border-radius:4px;opacity:0}
.todo-row:hover .todo-del{opacity:1}
.todo-row .todo-del:hover{background:var(--bg-hover);color:var(--red)}
.cal-d-wrap{display:flex;align-items:center}
.ev-row{
  display:flex;align-items:flex-start;gap:9px;padding:8px 4px;border-bottom:1px solid var(--border);
}
.ev-row:last-of-type{border-bottom:none}
.ev-dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;margin-top:6px;background:var(--gray)}
.ev-dot.red{background:var(--red)} .ev-dot.orange{background:var(--orange)}
.ev-dot.yellow{background:var(--yellow)} .ev-dot.green{background:var(--green)}
.ev-dot.blue{background:var(--blue)}
.ev-body{flex:1;min-width:0}
.ev-t{font-weight:500;overflow-wrap:anywhere}
.ev-t.done{text-decoration:line-through;color:var(--text-faint)}
.ev-m{font-size:12.5px;color:var(--text-dim);white-space:pre-wrap;overflow-wrap:anywhere}
.ev-acts{display:flex;gap:2px;flex:0 0 auto}
.ev-acts button{padding:2px 7px;border-radius:4px;font-size:12px;color:var(--text-faint)}
.ev-acts button:hover{background:var(--bg-hover);color:var(--text)}
.sw{display:flex;gap:5px;flex-wrap:wrap}
.sw button{
  width:22px;height:22px;border-radius:50%;border:2px solid transparent;
}
.sw button.on{border-color:var(--text)}
.sw button.muted{opacity:.25}
.sw button[data-val=gray]{background:var(--gray)}
.sw button[data-val=blue]{background:var(--blue)}
.sw button[data-val=green]{background:var(--green)}
.sw button[data-val=yellow]{background:var(--yellow)}
.sw button[data-val=orange]{background:var(--orange)}
.sw button[data-val=red]{background:var(--red)}

/* 사용 설명서 */
.steps{margin:10px 0 4px}
.step{display:flex;gap:13px;padding:11px 0;border-bottom:1px solid var(--border)}
.step:last-child{border-bottom:none}
.step-n{
  width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:var(--text);color:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;margin-top:3px;
}
.step-b{flex:1;min-width:0}
.step-t{font-weight:600;margin-bottom:2px}
.step-d{font-size:13.5px;color:var(--text-dim);line-height:1.75}
.step-d b{color:var(--text);font-weight:600}
.tbl-wrap{overflow-x:auto;margin:8px 0 4px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:420px}
table.tbl th,table.tbl td{
  border:1px solid var(--border);padding:8px 11px;text-align:left;vertical-align:top;line-height:1.65;
}
table.tbl th{background:var(--bg-sidebar);font-weight:600;font-size:12.5px;color:var(--text-dim)}
table.tbl td:first-child{width:36%;font-weight:500}
ul.plain{margin:6px 0 4px;padding-left:18px;font-size:14px;line-height:1.85}
ul.plain li{margin-bottom:3px}
ul.plain li b{font-weight:600}

/* 모달 */
.modal-bg{
  position:fixed;inset:0;background:rgba(15,15,15,.45);display:flex;align-items:center;
  justify-content:center;z-index:50;padding:20px;
}
.modal{
  background:var(--bg);border-radius:4px;box-shadow:var(--shadow);width:100%;max-width:560px;
  max-height:86vh;display:flex;flex-direction:column;border:1px solid var(--border-strong);
}

<script>
"use strict";
/* ============================================================
   근무 인수인계 · 일정관리 프로그램
   - 병사(위병조장/당직병)뿐 아니라 간부·군무원 등 누구나 직책을 추가해 쓸 수 있습니다.
   - 완전 로컬 실행: 브라우저 localStorage에만 저장됩니다.
   - 외부 통신 없음. 파일 하나로 동작합니다.
   ============================================================ */

/* ---------- 상수 ---------- */
const APP_VERSION = '3.1';          /* 화면 하단에 표시됩니다. 갱신 여부 확인용 */
const APP_DATE = '2026-09-16';
const DB_KEY = 'shdex.handover.v1';
const THEME_KEY = 'shdex.theme';

/* 직책은 병사(위병조장/당직병)만이 아니라 간부·군무원 등 필요한 만큼 자유롭게 추가·삭제합니다.
   목록의 실체는 db.roles 배열이고, ROLES는 키로 바로 찾아 쓰기 위한 조회용 사본입니다. */
let ROLES = {};
function syncRoles(source){
  const src = source || db;
  ROLES = {};
  src.roles.forEach(r => {
    if(typeof r.name !== 'string' || !r.name.trim()) r.name = '직책';
    r.mark = r.name.trim().slice(0,1);
    ROLES[r.key] = r;
  });
}
function newRoleKey(){ return 'role_' + uid(); }
/* 직책 배지 배경색 — role.color가 유효하면 그 색, 아니면 기본 강조색 */
function roleBadgeBg(r){
  return (r && r.color && EV_COLORS.indexOf(r.color) !== -1) ? 'var(--' + r.color + ')' : 'var(--accent)';
}
/* 직책 색의 옅은 배경(하이라이트용). 배지처럼 진한 색이 아니라 은은한 타일 색입니다. */
function roleTintBg(r){
  return (r && r.color && EV_COLORS.indexOf(r.color) !== -1) ? 'var(--' + r.color + '-bg)' : 'var(--accent-soft)';
}

const PRIORITY = {

  high:   { key:'high',   label:'중요', cls:'orange', rank:1 },

const ORDER_STATUS = {

};

const SHEET_STATUS = {

  handed:    { key:'handed',    label:'인계 완료', cls:'blue' },
  confirmed: { key:'confirmed', label:'인수 확인', cls:'green' },
};

/* 달력 일정 색상 */
const EV_COLORS = ['gray','blue','green','yellow','orange','red'];

/* 휴가 종류 — 직책(사람)마다 남은 일수를 직접 입력해 두고, 달력에 휴가를 등록하면 자동으로 차감됩니다. */
const LEAVE_TYPES = {
  annual:   { key:'annual',   label:'연가', color:'blue' },
  reward:   { key:'reward',   label:'포상', color:'green' },

/* ---------- 음력 데이터 (2024-2035) ---------- */
/* ny: [월,일] = 음력 1/1의 양력 날짜, leap: 윤달(0=없음), m: 각 월 일수(윤달 포함) */
const LUNAR_DATA = {
  2024:{ny:[2,10],leap:0,m:[29,30,29,30,29,30,29,30,29,30,29,30]},
  2025:{ny:[1,29],leap:6,m:[30,29,30,29,30,29,30,29,30,29,30,30,29]},
  2026:{ny:[2,17],leap:0,m:[30,29,30,30,29,30,29,30,30,29,30,29]},
  2027:{ny:[2,6],leap:0,m:[30,29,29,30,29,30,29,30,30,30,29,30]},
  2028:{ny:[1,26],leap:5,m:[29,30,29,29,30,29,30,29,30,30,30,29,30]},
  2029:{ny:[2,13],leap:0,m:[30,29,30,29,29,30,29,30,29,30,30,30]},
  2030:{ny:[2,3],leap:0,m:[29,30,29,30,29,29,30,29,30,29,30,30]},
  2031:{ny:[1,23],leap:3,m:[30,29,30,29,30,29,29,30,29,30,29,30,30]},
  2032:{ny:[2,11],leap:0,m:[30,29,30,30,29,30,29,29,30,29,30,29]},
  2033:{ny:[1,31],leap:11,m:[30,30,29,30,29,30,30,29,29,30,29,30,29]},
  2034:{ny:[2,19],leap:0,m:[30,29,30,29,30,30,29,30,29,30,29,30]},
  2035:{ny:[2,8],leap:0,m:[29,30,29,30,29,30,29,30,30,29,30,29]},
};

/* 음력→양력 기반 공휴일 (설날 3일, 부처님오신날, 추석 3일) */
const LUNAR_HOLIDAYS = {
  2024:{seollal:['2024-02-09','2024-02-10','2024-02-11'],buddha:'2024-05-15',chuseok:['2024-09-16','2024-09-17','2024-09-18']},
  2025:{seollal:['2025-01-28','2025-01-29','2025-01-30'],buddha:'2025-05-05',chuseok:['2025-10-05','2025-10-06','2025-10-07']},
  2026:{seollal:['2026-02-16','2026-02-17','2026-02-18'],buddha:'2026-05-24',chuseok:['2026-09-24','2026-09-25','2026-09-26']},
  2027:{seollal:['2027-02-05','2027-02-06','2027-02-07'],buddha:'2027-05-13',chuseok:['2027-09-14','2027-09-15','2027-09-16']},
  2028:{seollal:['2028-01-25','2028-01-26','2028-01-27'],buddha:'2028-05-02',chuseok:['2028-10-02','2028-10-03','2028-10-04']},
  2029:{seollal:['2029-02-12','2029-02-13','2029-02-14'],buddha:'2029-05-20',chuseok:['2029-09-21','2029-09-22','2029-09-23']},
  2030:{seollal:['2030-02-02','2030-02-03','2030-02-04'],buddha:'2030-05-09',chuseok:['2030-09-11','2030-09-12','2030-09-13']},
  2031:{seollal:['2031-01-22','2031-01-23','2031-01-24'],buddha:'2031-05-28',chuseok:['2031-09-30','2031-10-01','2031-10-02']},
  2032:{seollal:['2032-02-10','2032-02-11','2032-02-12'],buddha:'2032-05-16',chuseok:['2032-09-18','2032-09-19','2032-09-20']},
  2033:{seollal:['2033-01-30','2033-01-31','2033-02-01'],buddha:'2033-05-06',chuseok:['2033-09-07','2033-09-08','2033-09-09']},
  2034:{seollal:['2034-02-18','2034-02-19','2034-02-20'],buddha:'2034-05-25',chuseok:['2034-09-26','2034-09-27','2034-09-28']},
  2035:{seollal:['2035-02-07','2035-02-08','2035-02-09'],buddha:'2035-05-14',chuseok:['2035-09-15','2035-09-16','2035-09-17']},
};

/* ---------- 공휴일 맵 (연도별 캐시) ---------- */
const _holCache = {};
function buildHolidayMap(year){
  const map = {};
  const all = [];
  /* 양력 고정 공휴일 */
  [['01-01','신정'],['03-01','삼일절'],['05-05','어린이날'],['06-06','현충일'],
   ['08-15','광복절'],['10-03','개천절'],['10-09','한글날'],['12-25','성탄절']
  ].forEach(function(h){ all.push({date:year+'-'+h[0],name:h[1]}); });
  /* 음력 기반 공휴일 */
  var lunar = LUNAR_HOLIDAYS[year];
  if(lunar){
    all.push({date:lunar.seollal[0],name:'설날 연휴'});
    all.push({date:lunar.seollal[1],name:'설날'});
    all.push({date:lunar.seollal[2],name:'설날 연휴'});
    all.push({date:lunar.buddha,name:'부처님오신날'});
    all.push({date:lunar.chuseok[0],name:'추석 연휴'});
    all.push({date:lunar.chuseok[1],name:'추석'});
    all.push({date:lunar.chuseok[2],name:'추석 연휴'});
  }
  /* 기본 맵 + 중복 카운트 */
  var counts = {};
  all.forEach(function(h){
    if(!map[h.date]) map[h.date] = h.name;
    counts[h.date] = (counts[h.date]||0) + 1;
  });
  /* 대체휴일 계산: 토·일이면 다음 평일 */
  var findNext = function(from){
    var d = addDays(from, 1);
    for(var i=0;i<10;i++){
      var dow = new Date(d+'T00:00:00').getDay();
      if(dow!==0 && dow!==6 && !map[d]) return d;
      d = addDays(d, 1);
    }
    return d;
  };
  all.forEach(function(h){
    var dow = new Date(h.date+'T00:00:00').getDay();
    if(dow===0 || dow===6){
      var sub = findNext(h.date);
      if(!map[sub]) map[sub] = '대체휴일';
    }
  });
  /* 같은 날 공휴일 겹침 (예: 어린이날+부처님오신날) → 대체휴일 */
  Object.keys(counts).forEach(function(date){
    if(counts[date]>1){
      var dow = new Date(date+'T00:00:00').getDay();
      if(dow!==0 && dow!==6){
        var sub = findNext(date);
        if(!map[sub]) map[sub] = '대체휴일';
      }
    }
  });
  return map;
}
function getHolidayMap(year){
  if(!_holCache[year]) _holCache[year] = buildHolidayMap(year);
  return _holCache[year];
}
function holidayName(isoDate){
  var y = parseInt(isoDate.slice(0,4),10);
  return getHolidayMap(y)[isoDate] || null;
}

/* ---------- 양력→음력 변환 ---------- */
function daysBetweenISO(a,b){
  return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
}
function physToLunar(idx,leapMonth){
  if(leapMonth===0 || idx<leapMonth) return {month:idx+1,leap:false};
  if(idx===leapMonth) return {month:leapMonth,leap:true};
  return {month:idx,leap:false};
}
function solarToLunar(isoDate){
  var year = parseInt(isoDate.slice(0,4),10);
  for(var ly=year; ly>=year-1; ly--){
    var data = LUNAR_DATA[ly];
    if(!data) continue;
    var nyISO = ly+'-'+String(data.ny[0]).padStart(2,'0')+'-'+String(data.ny[1]).padStart(2,'0');
    if(isoDate < nyISO) continue;
    var remaining = daysBetweenISO(nyISO, isoDate);
    for(var i=0; i<data.m.length; i++){
      if(remaining < data.m[i]){
        var info = physToLunar(i, data.leap);
        return {year:ly, month:info.month, day:remaining+1, leap:info.leap};
      }
      remaining -= data.m[i];
    }
  }
  return null;
}
function lunarLabel(isoDate){
  var l = solarToLunar(isoDate);
  if(!l) return '';
  return (l.leap?'윤':'') + l.month + '.' + l.day;
}

/* ---------- 저장소 ---------- */
function freshDB(){
  return {
    version: 1,
    unit: '',
    activeRole: 'officer',
    roles: [
      { key:'officer', name:'간부',       mark:'간', color:'blue' },
      { key:'civil',   name:'군무원',     mark:'군', color:'green' },
      { key:'nco',     name:'당직부사관', mark:'당', color:'orange' },
      { key:'guard',   name:'위병조장',   mark:'위', color:'gray' },
    ],
    templates: { officer: [], civil: [], nco: [], guard: [] },
    shifts: [],
    orders: [],
    sheets: [],
    events: [],
    todos: [],
    lastNames: { officer:'', civil:'', nco:'', guard:'' },
    leaveBalances: { officer:{}, civil:{}, nco:{}, guard:{} },  /* 직책별 남은 휴가 일수 */
    notify: false,                        /* 브라우저 알림 사용 여부 */
    notifyLeadMin: 5,                     /* 몇 분 전에 알릴지 */
    lastBackupAt: '',                     /* 마지막으로 JSON 백업을 내려받은 시각 */
    createdAt: new Date().toISOString(),
  };
}

let db;
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return normalize(freshDB());
    const parsed = JSON.parse(raw);
    const base = freshDB();
    return normalize(Object.assign(base, parsed, {
      templates: Object.assign(base.templates, parsed.templates || {}),
      lastNames: Object.assign(base.lastNames, parsed.lastNames || {}),
      /* 예전 저장 파일에는 roles가 없으므로, base의 기본값이 그걸 가리지 않게 명시적으로 비웁니다.
         normalize()가 roleNames(더 예전 형식) 또는 기본값으로부터 직접 만들어 줍니다. */
      roles: (Array.isArray(parsed.roles) && parsed.roles.length) ? parsed.roles : null,
    }));
  }catch(e){
    console.error('저장 데이터를 읽지 못했습니다.', e);
    return normalize(freshDB());
  }
}
/* 백업 파일이나 예전 버전에서 빠진 값을 채워, 화면이 깨지지 않게 합니다. */
function normalize(d){
  if(!Array.isArray(d.orders)) d.orders = [];
  if(!Array.isArray(d.sheets)) d.sheets = [];
  if(!Array.isArray(d.events)) d.events = [];
  if(!Array.isArray(d.todos)) d.todos = [];
  d.todos.forEach(t => {
    ['date','text'].forEach(k => { if(typeof t[k] !== 'string') t[k] = ''; });
    if(typeof t.done !== 'boolean') t.done = false;
    if(typeof t.role !== 'string' || !t.role) t.role = 'both';
  });
  /* 직책 목록: 새 형식(d.roles)이 없으면 예전 형식(d.roleNames, 그마저 없으면 기본값)에서 만듭니다. */
  if(!Array.isArray(d.roles) || !d.roles.length){
    const gName = ((d.roleNames && d.roleNames.guard) || '').trim() || '위병조장';
    const dName = ((d.roleNames && d.roleNames.duty) || '').trim() || '당직병';
    d.roles = [ { key:'guard', name:gName }, { key:'duty', name:dName } ];
  }
  /* v3.1 마이그레이션: squad→nco 키 변환, 기본 4개 직책으로 확장, 당직병 제거 */
  d.roles.forEach(function(r){
    if(r.key === 'squad'){ r.key = 'nco'; r.name = '당직부사관'; r.mark = '당'; }
  });
  if(d.templates && d.templates.squad){ d.templates.nco = d.templates.squad; delete d.templates.squad; }
  if(d.lastNames && d.lastNames.squad){ d.lastNames.nco = d.lastNames.squad; delete d.lastNames.squad; }
  if(d.activeRole === 'squad') d.activeRole = 'nco';
  var defaults = [
    { key:'officer', name:'간부',       mark:'간' },
    { key:'civil',   name:'군무원',     mark:'군' },
    { key:'nco',     name:'당직부사관', mark:'당' },
  ];
  defaults.forEach(function(df){
    if(!d.roles.some(function(r){ return r.key === df.key; })){
      d.roles.unshift(df);
    }
  });
  d.roles = d.roles.filter(function(r){ return r.key !== 'duty'; });
  if(d.activeRole === 'duty') d.activeRole = d.roles[0].key;
  /* 기본 직책 순서 보장: 간부→군무원→당직부사관→위병조장→(사용자 추가분) */
  var ORDER = ['officer','civil','nco','guard'];
  d.roles.sort(function(a,b){
    var ai = ORDER.indexOf(a.key), bi = ORDER.indexOf(b.key);
    if(ai === -1) ai = ORDER.length;
    if(bi === -1) bi = ORDER.length;
    return ai - bi;
  });
  d.roles = d.roles.filter(r => r && typeof r.key === 'string' && r.key);
  if(!d.roles.length) d.roles = [ { key:'guard', name:'위병조장' } ];
  delete d.roleNames;
  /* 직책 배지 색 — 없거나 잘못된 값이면 색이 겹치지 않도록 순서대로 채워 줍니다 */
  d.roles.forEach(function(r, i){
    if(EV_COLORS.indexOf(r.color) === -1) r.color = EV_COLORS[i % EV_COLORS.length];
  });
  d.events.forEach(e => {
    if(EV_COLORS.indexOf(e.color) === -1) e.color = 'gray';
    if(e.role !== 'both' && !d.roles.some(r => r.key === e.role)) e.role = 'both';
    ['date','time','title','memo'].forEach(k => { if(typeof e[k] !== 'string') e[k] = ''; });
    if(['none','daily','weekly','monthly'].indexOf(e.repeat) === -1) e.repeat = 'none';
    if(typeof e.repeatUntil !== 'string') e.repeatUntil = '';
    if(!Array.isArray(e.exceptions)) e.exceptions = [];
    if(!Array.isArray(e.doneDates)) e.doneDates = [];
    if(typeof e.endDate !== 'string') e.endDate = '';
    if(e.endDate && e.endDate < e.date) e.endDate = '';
    if(LEAVE_TYPES[e.leaveType] === undefined) e.leaveType = '';
  });
  if(!Array.isArray(d.shifts)) d.shifts = [];
  if(!d.templates || typeof d.templates !== 'object') d.templates = {};
  if(!d.lastNames || typeof d.lastNames !== 'object') d.lastNames = {};
  if(!d.leaveBalances || typeof d.leaveBalances !== 'object') d.leaveBalances = {};
  d.roles.forEach(r => {
    if(!Array.isArray(d.templates[r.key])) d.templates[r.key] = [];
    if(typeof d.lastNames[r.key] !== 'string') d.lastNames[r.key] = '';
    if(!d.leaveBalances[r.key] || typeof d.leaveBalances[r.key] !== 'object') d.leaveBalances[r.key] = {};
    Object.keys(LEAVE_TYPES).forEach(k => {
      if(typeof d.leaveBalances[r.key][k] !== 'number' || isNaN(d.leaveBalances[r.key][k])) d.leaveBalances[r.key][k] = 0;
    });
  });
  /* 할 일도 직책별로 구분됩니다. 예전 데이터(직책 구분 없음)는 '공통'으로 남아 모두에게 계속 보입니다. */
  d.todos.forEach(t => {
    if(t.role !== 'both' && !d.roles.some(r => r.key === t.role)) t.role = 'both';
  });
  if(typeof d.notify !== 'boolean') d.notify = false;
  if(typeof d.notifyLeadMin !== 'number' || !d.notifyLeadMin) d.notifyLeadMin = 5;
  if(typeof d.lastBackupAt !== 'string') d.lastBackupAt = '';
  d.orders.forEach(o => {
    o.relayCount = o.relayCount || 0;
    o.priority = PRIORITY[o.priority] ? o.priority : 'normal';
    o.status = ORDER_STATUS[o.status] ? o.status : 'open';
    if(!Array.isArray(o.log)) o.log = [];
  });
  d.sheets.forEach(s => {
    if(!Array.isArray(s.checks)) s.checks = [];
    if(!Array.isArray(s.orderIds)) s.orderIds = [];
    if(!s.orderNotes || typeof s.orderNotes !== 'object') s.orderNotes = {};
    s.status = SHEET_STATUS[s.status] ? s.status : 'draft';
    ['outName','inName','notes','keyMessage','shift','date'].forEach(k => { if(typeof s[k] !== 'string') s[k] = ''; });
  });
  if(!d.roles.some(r => r.key === d.activeRole)) d.activeRole = d.roles[0].key;
  syncRoles(d);
  return d;
}

/* ---------- 유틸 ---------- */
const $ = (sel, root) => (root || document).querySelector(sel);
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function todayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function nowTime(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
const WEEKDAY = ['일','월','화','수','목','금','토'];
function fmtDate(iso){
  if(!iso) return '-';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + WEEKDAY[d.getDay()] + ')';
}
function fmtStamp(isoStamp){
  if(!isoStamp) return '-';
  const d = new Date(isoStamp);
  if(isNaN(d)) return '-';
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' +
    String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function fmtDateFull(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + WEEKDAY[d.getDay()] + ')';
}
function monthKeyOf(iso){ return iso.slice(0,7); }
function shiftMonth(key, delta){
  const y = parseInt(key.slice(0,4),10), m = parseInt(key.slice(5,7),10);
  const d = new Date(y, m - 1 + delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function addDays(iso, n){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function daysSince(isoStamp){
  if(!isoStamp) return 0;
  const diff = Date.now() - new Date(isoStamp).getTime();
  return Math.max(0, Math.floor(diff / 86400000));
}
function relative(isoStamp){
  if(!isoStamp) return '';
  const mins = Math.floor((Date.now() - new Date(isoStamp).getTime()) / 60000);
  if(mins < 1) return '방금';
  if(mins < 60) return mins + '분 전';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs + '시간 전';
  return Math.floor(hrs/24) + '일 전';
}
function toast(msg){
  const root = $('#toast-root');
  root.innerHTML = '<div class="toast">' + esc(msg) + '</div>';
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ root.innerHTML = ''; }, 2200);
}

function role(){ return ROLES[db.activeRole] || db.roles[0]; }
/* 직책 <select> 옵션 HTML. allLabel을 주면 맨 앞에 '공통(전체)' 옵션이 붙습니다. */

}

/* 3회 이상 인계되었는데도 끝나지 않은 지시 = 간부가 다시 말해야 하는 상황 */

function draftSheet(roleKey){

/* 일정은 직책과 무관하게 하나의 달력에 모두 표시하고, 해당 근무만 꼬리표로 구분합니다. */
/* 반복 일정 — event.date를 시작일(기준일)로 삼아 매일/매주/매월 반복되는지 판단합니다. */
function occursOn(e, date){
  if(date < e.date) return false;
  if(e.exceptions && e.exceptions.indexOf(date) !== -1) return false;
  if(e.endDate) return date <= e.endDate;   /* 기간 일정(휴가 등) — 반복과는 별개로 시작일~종료일 내내 나타납니다 */
  if(e.repeat === 'none' || !e.repeat) return date === e.date;
  if(e.repeatUntil && date > e.repeatUntil) return false;
  if(e.repeat === 'daily') return true;
  if(e.repeat === 'weekly') return daysBetweenISO(e.date, date) % 7 === 0;
  if(e.repeat === 'monthly'){
    return new Date(e.date + 'T00:00:00').getDate() === new Date(date + 'T00:00:00').getDate();
  }
  return false;
}
/* [from,to] 구간에서 실제로 발생하는 일정을 날짜별로 펼칩니다. 반복 일정과 기간 일정은 그 구간 안의 날짜마다 하나씩 만듭니다. */
function expandEvents(from, to){
  const out = [];
  db.events.forEach(e => {
    if(e.endDate || (e.repeat && e.repeat !== 'none')){
      let d = e.date > from ? e.date : from;
      const cap = e.endDate || e.repeatUntil;
      const until = cap && cap < to ? cap : to;
      while(d <= until){
        if(occursOn(e, d)) out.push(Object.assign({}, e, { date:d }));
        d = addDays(d, 1);
      }
      return;
    }
    if(e.date >= from && e.date <= to && occursOn(e, e.date)) out.push(e);
  });
  return out;
}
function eventsOn(date){
  return expandEvents(date, date).sort((a,b) => (a.time || '99:99') < (b.time || '99:99') ? -1 : 1);
}
function eventsBetween(from, to){
  return expandEvents(from, to)
    .sort((a,b) => (a.date + (a.time || '99:99')) < (b.date + (b.time || '99:99')) ? -1 : 1);
}
function getEvent(id){ return db.events.find(e => e.id === id); }
function todosOn(date){
  return db.todos.filter(t => t.date === date && (t.role === 'both' || t.role === db.activeRole));
}
function getTodo(id){ return db.todos.find(t => t.id === id); }

/* 지금 직책과 관련된 것(공통 + 이 직책) 중, 지금부터 가장 가까운 일정 하나를 찾습니다. 상단바 '다음 일정' 위젯에 씁니다. */
function nextUpcomingEvent(){
  const relevant = e => e.role === 'both' || e.role === db.activeRole;
  const today = todayISO();
  const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
  const todays = eventsOn(today).filter(relevant);
  const upcomingToday = todays.find(e => {
    if(!e.time) return true;   /* 종일 일정은 하루 내내 '진행 중'으로 봅니다 */
    const p = e.time.split(':').map(Number);
    return p[0] * 60 + p[1] >= nowMin;
  });
  if(upcomingToday) return upcomingToday;
  const future = eventsBetween(addDays(today, 1), addDays(today, 21)).filter(relevant);
  return future[0] || null;
}

function newSheet(roleKey){
  const existing = draftSheet(roleKey);
  if(existing) return existing;
  const sheet = {
    id: uid(),
    role: roleKey,
    date: todayISO(),
    shift: db.shifts[0] || '',
    startTime: nowTime(),
    endTime: '',
    outName: db.lastNames[roleKey] || '',
    inName: '',
    checks: (db.templates[roleKey] || []).map(t => ({ id:uid(), text:t, ok:false, note:'' })),
    orderIds: openOrders(roleKey).map(o => o.id),
    orderNotes: {},
    notes: '',
    keyMessage: '',
    status: 'draft',
    createdAt: new Date().toISOString(),
    handedAt: null,
    confirmedAt: null,
  };
  db.sheets.push(sheet);
  saveDB();
  return sheet;
}

function addOrder(data){
  const order = {
    id: uid(),
    role: data.role || db.activeRole,
    title: (data.title || '').trim(),
    body: (data.body || '').trim(),
    from: (data.from || '').trim(),
    priority: data.priority || 'normal',
    status: 'open',
    due: data.due || '',
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    relayCount: 0,
    log: [{ at:new Date().toISOString(), text:'지시사항 등록' + (data.from ? ' · 지시: ' + data.from.trim() : '') }],
  };
  db.orders.push(order);
  /* 작성 중인 인계서가 있으면 즉시 포함시켜, 다음 근무자가 반드시 보게 합니다. */
  const d = draftSheet(order.role === 'both' ? db.activeRole : order.role);
  if(d && d.orderIds.indexOf(order.id) === -1) d.orderIds.push(order.id);
  saveDB();
  return order;
}

function logOrder(order, text){
  order.log.push({ at:new Date().toISOString(), text:text });
  order.updatedAt = new Date().toISOString();
}

function setOrderStatus(order, status, note){
  if(order.status === status && !note) return;
  order.status = status;
  logOrder(order, (ORDER_STATUS[status] ? ORDER_STATUS[status].label + '(으)로 변경' : status) + (note ? ' · ' + note : ''));
  saveDB();
}

/* 인수 확인 — 인계 기록을 확정하고 지시사항 상태를 갱신합니다. */
function confirmSheet(sheet){
  sheet.status = 'confirmed';
  sheet.confirmedAt = new Date().toISOString();
  if(!sheet.handedAt) sheet.handedAt = sheet.confirmedAt;
  if(!sheet.endTime) sheet.endTime = nowTime();
  db.lastNames[sheet.role] = sheet.inName || db.lastNames[sheet.role];

  sheet.orderIds.forEach(oid => {
    const order = getOrder(oid);
    if(!order || order.status === 'done') return;
    const info = sheet.orderNotes[oid] || {};
    if(info.action === 'done'){
      order.status = 'done';
      logOrder(order, '완료 처리 · ' + (sheet.outName || '인계자') + (info.note ? ' · ' + info.note : ''));
    }else{
      order.relayCount = (order.relayCount || 0) + 1;
      logOrder(order, (order.relayCount) + '회차 인계 · ' + (sheet.outName || '?') + ' → ' + (sheet.inName || '?') +
        (info.note ? ' · ' + info.note : ''));
    }
  });
  saveDB();
}

function deleteSheet(id){
  db.sheets = db.sheets.filter(s => s.id !== id);
  saveDB();
}
function deleteOrder(id){
  db.orders = db.orders.filter(o => o.id !== id);
  db.sheets.forEach(s => { s.orderIds = s.orderIds.filter(x => x !== id); });
  saveDB();
}

/* ---------- 알림 ---------- */
/* 이 탭이 열려 있는 동안, 시간이 정해진 오늘 일정이 설정한 시간(기본 5분) 이내로 다가오면 한 번씩 알립니다.
   탭을 닫으면 동작하지 않는 한계가 있어, 설정 화면에도 이 사실을 안내해 둡니다. */
const _notified = new Set();
function checkNotifications(){
  if(!db.notify || typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const now = new Date();
  const nowMinutes = now.getHours() * 60 + now.getMinutes();
  const lead = db.notifyLeadMin || 5;
  eventsOn(todayISO()).forEach(e => {
    if(!e.time) return;
    const key = e.id + '@' + e.date + '@' + e.time;
    if(_notified.has(key)) return;
    const parts = e.time.split(':').map(Number);
    const evMinutes = parts[0] * 60 + parts[1];
    if(evMinutes - nowMinutes <= lead && evMinutes - nowMinutes >= -1){
      _notified.add(key);
      try{
        new Notification(role().name + ' 일정 알림', {
          body: e.time + ' ' + e.title + (e.memo ? ' · ' + e.memo : ''),
        });
      }catch(err){ /* 알림 생성에 실패해도 화면 동작에는 영향이 없어야 합니다 */ }
    }
  });
}

/* IME(한글) 조합 중에는 Enter·Escape 가 글자 확정/조합 취소 용도로 쓰입니다.
   이때 버튼 동작까지 실행되면 마지막 글자가 잘리거나 창이 닫히므로 걸러냅니다. */
function isComposing(e){
  return e.isComposing === true || e.keyCode === 229;
}

  if(isComposing(e)) return;
  if(e.key === 'Escape') closeModal();
});

    '</div>' +
    '<div class="nav">' +
      item('home','홈', 0) +
      '<button class="nav-item" data-act="start-handover"><span>' +
        (d ? '작성 중인 인계서' : '인계서 작성') + '</span>' +
        (d ? '<span class="dot"></span>' : '') + '</button>' +
      '<div class="nav-label">기록</div>' +
      item('calendar','달력', 0) +
      item('orders','지시사항', nOpen, nStall > 0) +
      item('records','인계 기록', 0) +
      '<div class="nav-label">관리</div>' +
      item('settings','설정', 0) +
      item('guide','사용 설명서', 0) +
    '</div>' +
    '<div class="sidebar-foot">' +
      '<button data-act="theme">' + (document.documentElement.getAttribute('data-theme') === 'dark' ? '라이트 모드' : '다크 모드') + '</button>' +
      '<button data-act="export">백업</button>' +
    '</div>';
}

/* 상단바에 항상 떠 있는 '다음 일정' 위젯. 눌러 그 날짜로 바로 이동합니다. */
function nextUpcomingHTML(){
  const e = nextUpcomingEvent();
  if(!e) return '';
  const today = todayISO();
  let when;
  if(e.date === today) when = e.time ? '오늘 ' + e.time : '오늘 종일';
  else if(e.date === addDays(today, 1)) when = e.time ? '내일 ' + e.time : '내일 종일';
  else when = fmtDate(e.date) + (e.time ? ' ' + e.time : '');
  return '<button class="next-ev no-print" data-act="go-event" data-date="' + e.date + '" title="다음 일정으로 이동">' +
    '<span class="ev-dot ' + e.color + '"></span>' +
    '<span class="next-ev-label">다음 일정</span>' +
    '<b>' + esc(e.title) + '</b>' +
    '<span class="faint">' + esc(when) + '</span>' +
  '</button>';
}
function renderTopbar(){
  const r = role();
  let crumb = '';
  if(state.view === 'sheet'){
    const s = getSheet(state.sheetId);
    crumb = '<span data-act="go" data-view="records" style="cursor:pointer">인계 기록</span><span class="sep">/</span><b>' +
      (s ? esc(fmtDate(s.date) + ' ' + (s.shift || '')) : '인계서') + '</b>';
  }else if(state.view === 'order'){
    const o = getOrder(state.orderId);
    crumb = '<span data-act="go" data-view="orders" style="cursor:pointer">지시사항</span><span class="sep">/</span><b>' +
      (o ? esc(o.title) : '') + '</b>';
  }else{
    const names = { home:'홈', orders:'지시사항', records:'인계 기록',
                    settings:'설정', guide:'사용 설명서', calendar:'달력' };
    crumb = '<span>' + esc(r.name) + '</span><span class="sep">/</span><b>' + (names[state.view] || '홈') + '</b>';
  }
  $('#topbar').innerHTML =
    '<button class="icon-btn" data-act="toggle-sidebar" title="사이드바 열고 닫기">' +
      '<svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" ' +
      'stroke-width="1.5" stroke-linecap="round"><path d="M2 4h11M2 7.5h11M2 11h11"/></svg>' +
    '</button>' +
    '<div class="crumb">' + crumb + '</div>' +
    nextUpcomingHTML() +
    '<div class="spacer"></div>' +
    '<button class="btn sm" data-act="new-order">지시사항 등록</button>' +
    (state.view === 'sheet' || state.view === 'guide' || state.view === 'calendar'
      ? '<button class="btn sm" data-act="print">인쇄</button>' : '');
}

/* ---------- 홈 ---------- */
function viewHome(){
  const r = role();
  const open = openOrders(r.key);
  const stall = stalled(r.key);
  const sheets = sheetsFor(r.key);
  const last = sheets.find(s => s.status !== 'draft');
  const d = draftSheet(r.key);
  const urgent = open.filter(o => o.priority === 'urgent' || o.priority === 'high');
  const overdue = open.filter(o => o.due && o.due < todayISO());

  let h = '<div class="page">';
  h += '<div class="page-title">' + esc(r.name) + ' 인수인계</div>';
  h += '<div class="page-desc">' + esc(db.unit || '부대명을 설정에서 입력하세요') + ' · ' + fmtDate(todayISO()) + '</div>';

  /* 경고 배너 — 같은 지시를 반복해서 받고 있는 상태 */
  if(stall.length){
    h += '<div class="callout danger">' +
      '<b>' + stall.length + '건</b>이 3회 이상 이월되었으나 아직 처리되지 않았습니다. ' +
      '같은 지시가 반복되기 전에 이번 근무에서 정리하십시오.' +
      '<div style="margin-top:8px"><button class="btn sm" data-act="go" data-view="orders">지시사항 보기</button></div>' +
      '</div>';
  }
  if(!(db.templates[r.key] || []).length){
    h += '<div class="callout warn">' +
      '<b>' + esc(r.name) + ' 점검 항목이 등록되어 있지 않습니다.</b> ' +
      '설정에서 우리 부대에서 실제로 확인하는 항목을 먼저 등록하십시오. ' +
      '등록한 항목이 새 인계서마다 자동으로 들어갑니다.' +
      '<div style="margin-top:8px"><button class="btn sm" data-act="go" data-view="settings">설정으로 가기</button></div>' +
      '</div>';
  }
  if(d){
    h += '<div class="callout info">' +
      '작성 중인 인계서가 있습니다. (' + esc(fmtDate(d.date)) + ' · ' + esc(d.shift || '시간 미지정') + ')' +
      '<div style="margin-top:8px"><button class="btn sm primary" data-act="open-sheet" data-id="' + d.id + '">이어서 작성</button></div>' +
      '</div>';
  }
  /* 백업 리마인더 — 쌓인 데이터가 있는데 최근 7일 안에 백업한 적이 없으면 알려줍니다 */
  if((db.sheets.length || db.orders.length || db.events.length) &&
     (!db.lastBackupAt || daysSince(db.lastBackupAt) >= 7)){
    h += '<div class="callout warn">' +
      (db.lastBackupAt
        ? '<b>마지막 백업이 ' + daysSince(db.lastBackupAt) + '일 전입니다.</b> 이 컴퓨터에만 저장되어 있으니 지금 받아 두십시오.'
        : '<b>아직 백업을 받은 적이 없습니다.</b> 브라우저 기록이 지워지면 모두 사라지니 지금 받아 두십시오.') +
      '<div style="margin-top:8px"><button class="btn sm" data-act="export">지금 백업 받기</button></div>' +
      '</div>';
  }

  h += '<div class="grid g4" style="margin:20px 0 6px">' +
    stat(open.length, '미처리 지시사항', open.length ? 'alert' : 'good') +
    stat(urgent.length, '긴급·중요') +
    stat(overdue.length, '기한 경과', overdue.length ? 'alert' : '') +
    stat(sheets.filter(s=>s.status==='confirmed').length, '누적 인계') +
  '</div>';

  const leaveBal = db.leaveBalances[r.key] || {};
  h += '<h2 class="sec">남은 휴가</h2>';
  h += '<div class="grid g4">' +
    Object.keys(LEAVE_TYPES).map(k => stat(leaveBal[k] || 0, LEAVE_TYPES[k].label + ' 남음')).join('') +
  '</div>';

  h += '<div class="btn-row" style="margin:22px 0 4px">' +
    '<button class="btn primary big" data-act="start-handover">' + (d ? '인계서 이어쓰기' : '인계서 작성') + '</button>' +
    '<button class="btn big" data-act="new-order">지시사항 등록</button>' +
  '</div>';

  /* 지금 챙겨야 할 것 */
  h += '<h2 class="sec">미처리 지시사항</h2>';
  const focus = open.slice(0, 6);
  if(!focus.length){
    h += '<div class="empty">미처리 지시사항이 없습니다.</div>';
  }else{
    focus.forEach(o => { h += orderCard(o); });
    if(open.length > focus.length){
      h += '<button class="btn ghost sm" data-act="go" data-view="orders">전체 ' + open.length + '건 보기</button>';
    }
  }

  /* 최근 인계 */
  /* 다가오는 일정 — 오늘부터 일주일 */
  const upcoming = eventsBetween(todayISO(), addDays(todayISO(), 7));
  h += '<h2 class="sec">다가오는 일정</h2>';
  if(!upcoming.length){
    h += '<div class="empty">이번 주 등록된 일정이 없습니다.</div>';
  }else{
    upcoming.slice(0, 6).forEach(e => {
      h += '<div class="row" data-act="cal-day" data-date="' + e.date + '" style="cursor:pointer">' +
        '<span class="ev-dot ' + e.color + '" style="margin-top:0"></span>' +
        '<div class="grow"><div class="ttl">' + esc(e.title) + '</div>' +
          '<div class="card-meta"><span>' +
            (e.date === todayISO() ? '오늘' : (e.date === addDays(todayISO(),1) ? '내일' : esc(fmtDate(e.date)))) +
          '</span>' + (e.time ? '<span>' + esc(e.time) + '</span>' : '<span>종일</span>') +
          (e.role !== 'both' && ROLES[e.role] ? '<span>' + esc(ROLES[e.role].name) + '</span>' : '') +
        '</div></div></div>';
    });
    if(upcoming.length > 6){
      h += '<button class="btn ghost sm" data-act="go" data-view="calendar">달력에서 전체 보기</button>';
    }
  }

  h += '<h2 class="sec">최근 인계</h2>';
  const recent = sheets.filter(s => s.status !== 'draft').slice(0, 4);
  if(!recent.length){
    h += '<div class="empty">인계 기록이 없습니다.</div>';
  }else{
    recent.forEach(s => { h += sheetRow(s); });
    if(last){
      h += '<div class="tiny faint" style="margin-top:10px">마지막 인계 ' +
        relative(last.confirmedAt || last.handedAt) + '</div>';
    }
  }
  h += '</div>';
  return h;
}

function stat(n, label, cls){
  return '<div class="stat ' + (cls||'') + '"><div class="n mono">' + n + '</div><div class="l">' + esc(label) + '</div></div>';
}

function orderCard(o){
  const p = PRIORITY[o.priority] || PRIORITY.normal;
  const st = ORDER_STATUS[o.status] || ORDER_STATUS.open;
  const late = o.due && o.due < todayISO() && o.status !== 'done';
  return '<div class="card click" data-act="open-order" data-id="' + o.id + '">' +
    '<div class="card-row"><div style="flex:1;min-width:0">' +
      '<div class="card-title">' + esc(o.title) + '</div>' +
      (o.body ? '<div class="small muted" style="margin-bottom:6px;overflow-wrap:anywhere">' +
        esc(o.body.length > 110 ? o.body.slice(0,110) + '…' : o.body) + '</div>' : '') +
      '<div class="card-meta">' +
        '<span class="tag ' + p.cls + '">' + p.label + '</span>' +
        '<span class="tag ' + st.cls + '">' + st.label + '</span>' +
        (o.role === 'both' ? '<span class="tag">공통</span>' : '') +
        (o.from ? '<span>지시: ' + esc(o.from) + '</span>' : '') +
        (o.due ? '<span' + (late ? ' style="color:var(--red);font-weight:600"' : '') + '>기한 ' + esc(fmtDate(o.due)) + (late ? ' · 경과' : '') + '</span>' : '') +
        (o.relayCount >= 3 ? '<span class="tag red">' + o.relayCount + '회 이월</span>' :
          (o.relayCount ? '<span>' + o.relayCount + '회 이월</span>' : '<span>신규</span>')) +
      '</div>' +
    '</div></div></div>';
}

function sheetRow(s){
  const st = SHEET_STATUS[s.status] || SHEET_STATUS.draft;
  const doneChecks = s.checks.filter(c => c.ok).length;
  return '<div class="row" data-act="open-sheet" data-id="' + s.id + '" style="cursor:pointer">' +
    '<div class="grow">' +
      '<div class="ttl">' + esc(fmtDate(s.date)) + ' · ' + esc(s.shift || '시간 미지정') + '</div>' +
      '<div class="card-meta"><span>' + esc(s.outName || '?') + ' → ' + esc(s.inName || '?') + '</span>' +
      '<span>점검 ' + doneChecks + '/' + s.checks.length + '</span>' +
      '<span>지시 ' + s.orderIds.length + '건</span></div>' +
    '</div>' +
    '<span class="tag ' + st.cls + '">' + st.label + '</span>' +
  '</div>';
}

/* ---------- 인계서 ---------- */
function viewSheet(){
  const s = getSheet(state.sheetId);
  if(!s) return '<div class="page"><div class="empty">인계서를 찾을 수 없습니다.</div></div>';
  const r = ROLES[s.role] || { name:'(삭제된 직책)', mark:'?' };
  const editable = s.status !== 'confirmed';
  const st = SHEET_STATUS[s.status] || SHEET_STATUS.draft;
  const checked = s.checks.filter(c => c.ok).length;
  const orders = s.orderIds.map(getOrder).filter(Boolean);

  let h = '<div class="page">';
  h += '<div class="page-title">' + esc(r.name) + ' 인계서</div>';
  h += '<div class="page-desc">' + esc(db.unit || '') + (db.unit ? ' · ' : '') +
       esc(fmtDate(s.date)) + ' · <span class="tag ' + st.cls + '">' + st.label + '</span></div>';

  /* 머리글 */
  h += '<div class="sheet-head">';
  if(editable){
    h += '<div class="grid g2">' +
      f('근무일자', '<input type="date" data-in="sheet:date" value="' + esc(s.date) + '">') +
      f('근무 구분', shiftField(s)) +
      f('인계자 (나가는 근무자)', '<input type="text" data-in="sheet:outName" placeholder="계급 / 성명" value="' + esc(s.outName) + '">') +
      f('인수자 (들어오는 근무자)', '<input type="text" data-in="sheet:inName" placeholder="계급 / 성명" value="' + esc(s.inName) + '">') +
    '</div>';
  }else{
    h += '<div class="kv">' +
      '<div class="k">근무일자</div><div>' + esc(fmtDate(s.date)) + '</div>' +
      '<div class="k">근무 구분</div><div>' + esc(s.shift || '-') + '</div>' +
      '<div class="k">인계자</div><div>' + esc(s.outName || '-') + '</div>' +
      '<div class="k">인수자</div><div>' + esc(s.inName || '-') + '</div>' +
    '</div>';
  }
  h += '</div>';

  /* 근무 중 챙겨야 할 일정 — 인계서에도 같이 남깁니다. */
  const sheetEvents = eventsBetween(s.date, addDays(s.date, 1));
  if(sheetEvents.length){
    h += '<h2 class="sec">예정된 일정</h2>';
    h += '<div class="card" style="padding:6px 12px">' +
      sheetEvents.map(e =>
        '<div class="ev-row"><span class="ev-dot ' + e.color + '"></span><div class="ev-body">' +
          '<div class="ev-t">' + (e.date === s.date ? '오늘' : '내일') + ' ' +
            (e.time ? '<span class="faint mono">' + esc(e.time) + '</span> ' : '') + esc(e.title) + '</div>' +
          (e.memo ? '<div class="ev-m">' + esc(e.memo) + '</div>' : '') +
        '</div></div>').join('') +
    '</div>';
  }

  /* 1. 점검 항목 */
  h += '<h2 class="sec"><span class="sec-num">①</span> 점검 항목 <span class="tiny faint mono" id="check-count">' + checked + '/' + s.checks.length + '</span></h2>';
  if(!s.checks.length){
    h += '<div class="empty small">점검 항목이 없습니다. 설정에서 기본 항목을 추가할 수 있습니다.</div>';
  }
  s.checks.forEach(c => {
    h += '<div class="check' + (c.ok ? ' done' : '') + '">' +
      '<input type="checkbox" data-in="check:' + c.id + ':ok"' + (c.ok ? ' checked' : '') + (editable ? '' : ' disabled') + '>' +
      '<div class="txt"><div class="t">' + esc(c.text) + '</div>' +
        (editable
          ? '<input class="note" data-in="check:' + c.id + ':note" placeholder="비고 (수량, 특이사항 등)" value="' + esc(c.note) + '">'
          : (c.note ? '<div class="note" style="color:var(--text-dim)">' + esc(c.note) + '</div>' : '')) +
      '</div>' +
      (editable ? '<button class="del" data-act="del-check" data-id="' + c.id + '" title="삭제">×</button>' : '') +
    '</div>';
  });
  if(editable){
    h += '<div class="btn-row" style="margin-top:8px">' +
      '<input type="text" id="new-check" placeholder="점검 항목 추가 후 Enter" style="max-width:340px">' +
      '<button class="btn sm" data-act="add-check">추가</button></div>';
  }

  /* 2. 지시사항 인계 — 핵심 */
  h += '<h2 class="sec"><span class="sec-num">②</span> 지시사항 인계 <span class="tiny faint">' + orders.length + '건</span></h2>';
  h += '<div class="callout info small no-print">' +
    '완료로 표시하지 않은 항목은 다음 근무자에게 그대로 넘어갑니다. ' +
    '처리한 항목은 완료로 바꾸십시오.</div>';
  if(!orders.length){
    h += '<div class="empty small">인계할 미처리 지시사항이 없습니다.</div>';
  }
  orders.forEach(o => {
    const info = s.orderNotes[o.id] || { action:'keep', note:'' };
    const p = PRIORITY[o.priority] || PRIORITY.normal;
    h += '<div class="card">' +
      '<div class="card-row"><div style="flex:1;min-width:0">' +
        '<div class="card-title">' + esc(o.title) + '</div>' +
        (o.body ? '<div class="small muted order-body" style="margin:4px 0 6px">' + esc(o.body) + '</div>' : '') +
        '<div class="card-meta" style="margin-bottom:' + (editable ? '10px' : '0') + '">' +
          '<span class="tag ' + p.cls + '">' + p.label + '</span>' +
          (o.from ? '<span>지시: ' + esc(o.from) + '</span>' : '') +
          (o.due ? '<span>기한 ' + esc(fmtDate(o.due)) + '</span>' : '') +
          (o.relayCount >= 3 ? '<span class="tag red">' + o.relayCount + '회 이월</span>' :
            (o.relayCount ? '<span>' + o.relayCount + '회 이월</span>' : '')) +
        '</div>' +
        (editable
          ? '<div class="btn-row">' +
              '<div class="seg" data-group="order-action">' +
                ['keep','done','hold'].map(a => {
                  const lbl = a === 'keep' ? '계속 인계' : (a === 'done' ? '완료' : '보류');
                  const on = (info.action || 'keep') === a;
                  return '<button class="' + (on ? 'on' : '') + '" data-act="order-action" data-id="' + o.id + '" data-val="' + a + '">' + lbl + '</button>';
                }).join('') +
              '</div>' +
              '<input type="text" data-in="ordernote:' + o.id + '" placeholder="진행 상황 / 인계 멘트" value="' + esc(info.note || '') + '" style="flex:1;min-width:180px">' +
            '</div>'
          : (info.note ? '<div class="small muted">→ ' + esc(info.note) + '</div>' : '')) +
      '</div></div></div>';
  });
  if(editable){
    h += '<button class="btn sm" data-act="new-order">이번 근무에 받은 지시 추가</button>';
  }

  /* 3. 반드시 전달 */
  h += '<h2 class="sec"><span class="sec-num">③</span> 반드시 전달할 사항</h2>';
  if(editable){
    h += '<textarea data-in="sheet:keyMessage" placeholder="다음 근무자가 반드시 알아야 할 내용을 한두 줄로 적으십시오.&#10;예) 23시 이후 정문 보수공사 차량 2대 출입 예정, 간부 확인 후 통과">' + esc(s.keyMessage) + '</textarea>';
  }else{
    h += s.keyMessage
      ? '<div class="callout warn"><div class="order-body">' + esc(s.keyMessage) + '</div></div>'
      : '<div class="small faint">기재 없음</div>';
  }

  /* 4. 특이사항 */
  h += '<h2 class="sec"><span class="sec-num">④</span> 근무 중 특이사항</h2>';
  if(editable){
    h += '<textarea data-in="sheet:notes" style="min-height:140px" placeholder="시각 순으로 기록하십시오.&#10;예) 19:40 대대 상황실 유선, 금일 훈련 미복귀 인원 없음 확인&#10;21:10 외부 차량 1대 방문(면회), 출입증 3번 발급 후 22:05 반납">' + esc(s.notes) + '</textarea>';
  }else{
    h += s.notes
      ? '<div class="card order-body">' + esc(s.notes) + '</div>'
      : '<div class="small faint">기재 없음</div>';
  }

  /* 서명 / 확정 */
  h += '<div class="sign">' +

/* 설정에 등록된 근무 구분이 있으면 목록에서 고르고, 없으면 직접 입력합니다. */
function shiftField(s){
  if(!db.shifts.length){
    return '<input type="text" data-in="sheet:shift" ' +
      'placeholder="근무 시간대 (설정에서 목록으로 등록할 수 있습니다)" value="' + esc(s.shift) + '">';
  }
  const opts = db.shifts.slice();
  if(s.shift && opts.indexOf(s.shift) === -1) opts.unshift(s.shift);
  return '<select data-in="sheet:shift">' +
    (s.shift ? '' : '<option value="">선택하십시오</option>') +
    opts.map(x => '<option' + (x === s.shift ? ' selected' : '') + '>' + esc(x) + '</option>').join('') +
    '</select>';
}

function f(label, inner){
  return '<div class="field"><label>' + esc(label) + '</label>' + inner + '</div>';
}

/* ---------- 지시사항 목록 ---------- */
function viewOrders(){
  const r = role();
  const all = ordersFor(r.key);
  const filter = state.orderFilter;
  let list = all.filter(o => filter === 'all' ? true : (filter === 'done' ? o.status === 'done' : o.status !== 'done'));
  list.sort((a,b) => (PRIORITY[a.priority].rank - PRIORITY[b.priority].rank) ||
                     (b.relayCount - a.relayCount) || (a.createdAt < b.createdAt ? -1 : 1));
  const stall = stalled(r.key);

  let h = '<div class="page">';
  h += '<div class="page-title">지시사항</div>';
  h += '<div class="page-desc">간부에게 받은 지시를 등록합니다. 완료 처리 전까지 모든 인계서에 자동으로 포함됩니다.</div>';

  if(stall.length){
    h += '<div class="callout danger">' +
      '<b>' + stall.length + '건</b>이 3회 이상 이월되었습니다. 처리하거나, ' +
      '처리가 어려운 사유를 지시한 간부에게 보고하십시오.</div>';
  }

  h += '<div class="btn-row" style="margin:16px 0 12px">' +
    '<div class="seg">' +
      [['open','미완료'],['done','완료'],['all','전체']].map(([k,l]) =>
        '<button class="' + (filter === k ? 'on' : '') + '" data-act="order-filter" data-val="' + k + '">' + l + '</button>').join('') +
    '</div>' +
    '<div class="spacer"></div>' +
    '<button class="btn primary" data-act="new-order">지시사항 등록</button>' +
  '</div>';

  if(!list.length){
    h += '<div class="empty">' +
      (filter === 'done' ? '완료된 지시사항이 없습니다.' : '등록된 지시사항이 없습니다.') + '</div>';
  }else{
    list.forEach(o => { h += orderCard(o); });
  }
  h += '</div>';
  return h;
}

/* ---------- 지시사항 상세 ---------- */
function viewOrder(){
  const o = getOrder(state.orderId);
  if(!o) return '<div class="page"><div class="empty">지시사항을 찾을 수 없습니다.</div></div>';
  const p = PRIORITY[o.priority] || PRIORITY.normal;
  const st = ORDER_STATUS[o.status] || ORDER_STATUS.open;
  const late = o.due && o.due < todayISO() && o.status !== 'done';

  let h = '<div class="page">';
  h += '<div class="page-title">' + esc(o.title) + '</div>';
  h += '<div class="btn-row" style="margin-bottom:18px">' +
    '<span class="tag ' + p.cls + '">' + p.label + '</span>' +
    '<span class="tag ' + st.cls + '">' + st.label + '</span>' +
    (o.relayCount ? '<span class="tag' + (o.relayCount >= 3 ? ' red' : '') + '">' + o.relayCount + '회 이월</span>' : '') +
    '<span class="tiny faint">등록 ' + fmtStamp(o.createdAt) + ' · ' + daysSince(o.createdAt) + '일 경과</span>' +
  '</div>';

  if(o.relayCount >= 3 && o.status !== 'done'){
    h += '<div class="callout danger">' +
      '이 지시는 ' + o.relayCount + '회 이월되는 동안 처리되지 않았습니다. ' +
      '지금 처리하거나, 처리가 어려운 사유를 ' + esc(o.from || '지시한 간부') + '에게 보고하고 ' +
      '완료 또는 보류로 정리하십시오.</div>';
  }

  h += '<div class="sheet-head"><div class="kv">' +
    '<div class="k">지시한 사람</div><div>' + esc(o.from || '-') + '</div>' +
    '<div class="k">대상 직책</div><div>' + (o.role === 'both' ? '공통 (전체 직책)' : esc(ROLES[o.role] ? ROLES[o.role].name : '(삭제된 직책)')) + '</div>' +
    '<div class="k">기한</div><div' + (late ? ' style="color:var(--red);font-weight:600"' : '') + '>' +
      (o.due ? esc(fmtDate(o.due)) + (late ? ' · 경과' : '') : '없음') + '</div>' +
  '</div></div>';

  h += '<h2 class="sec">상태 변경</h2>';
  h += '<div class="btn-row">' +
    '<div class="seg">' +
      ['open','hold','done'].map(k =>
        '<button class="' + (o.status === k ? 'on' : '') + '" data-act="set-order-status" data-id="' + o.id + '" data-val="' + k + '">' +
        ORDER_STATUS[k].label + '</button>').join('') +
    '</div>' +
    '<button class="btn sm" data-act="edit-order" data-id="' + o.id + '">내용 수정</button>' +
    '<button class="btn sm danger" data-act="del-order" data-id="' + o.id + '">삭제</button>' +

  h += '<h2 class="sec">처리 이력</h2>';
  h += '<div class="timeline">' +
    o.log.slice().reverse().map(l =>
      '<div class="tl-item"><div>' + esc(l.text) + '</div><div class="when">' + fmtStamp(l.at) + '</div></div>').join('') +
  '</div>';

  h += '<div class="btn-row" style="margin-top:10px">' +
    '<input type="text" id="log-note" placeholder="진행 상황 메모 추가" style="max-width:400px">' +
    '<button class="btn sm" data-act="add-log" data-id="' + o.id + '">기록</button></div>';

/* 검색 결과만 따로 그립니다. 입력창은 건드리지 않으므로 한글 조합이 유지됩니다. */
function recordList(){
  const q = state.recordQuery.trim().toLowerCase();
  let list = sheetsFor(role().key);
  if(q){
    list = list.filter(s => {
      const hay = [s.date, s.shift, s.outName, s.inName, s.notes, s.keyMessage]
        .concat(s.checks.map(c => c.text + ' ' + c.note))
        .join(' ').toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }
  if(!list.length){
    return '<div class="empty">' + (q ? '검색 결과가 없습니다.' : '인계 기록이 없습니다.') + '</div>';
  }
  let h = '', lastMonth = '';
  list.forEach(s => {
    const m = s.date.slice(0,7);
    if(m !== lastMonth){
      lastMonth = m;
      h += '<h3 class="sub">' + esc(m.replace('-','년 ') + '월') + '</h3>';
    }
    h += sheetRow(s);
  });
  return h;
}

/* ---------- 달력 ---------- */
/* 달력에서 '전체 일정' 대신 특정 직책·색상만 보고 싶을 때 씁니다. 하루/인계서 화면 등에는 영향이 없습니다. */
function calFilter(list){
  return list.filter(e =>
    (state.calRoleFilter === 'all' || e.role === 'both' || e.role === state.calRoleFilter) &&
    state.calColorFilter.indexOf(e.color) === -1
  );
}
function weekStartOf(iso){
  return addDays(iso, -(new Date(iso + 'T00:00:00').getDay()));
}
function calRoleFilterHTML(){
  return '<select id="cal-role-filter" style="width:auto;max-width:170px">' +
    '<option value="all"' + (state.calRoleFilter === 'all' ? ' selected' : '') + '>전체 직책 일정</option>' +
    db.roles.map(r => '<option value="' + r.key + '"' + (state.calRoleFilter === r.key ? ' selected' : '') +
      '>' + esc(r.name) + ' 일정</option>').join('') +
  '</select>';
}
/* 색상(카테고리)별로 켜고 끄는 작은 점 목록. 꺼진 색은 옅게 표시됩니다. */
function calColorFilterHTML(){
  return '<div class="sw" title="색상으로 걸러보기" style="margin:0 2px">' + EV_COLORS.map(c =>
    '<button data-act="cal-color-toggle" data-val="' + c + '" class="' +
      (state.calColorFilter.indexOf(c) === -1 ? 'on' : 'muted') + '"></button>').join('') +
  '</div>';
}
function viewCalendar(){
  let navTitle = '', addDate = todayISO();
  if(state.calMode === 'month'){
    const y = parseInt(state.calMonth.slice(0,4),10), m = parseInt(state.calMonth.slice(5,7),10);
    navTitle = y + '년 ' + m + '월';
    addDate = state.calMonth === todayISO().slice(0,7) ? todayISO() : state.calMonth + '-01';
  }else if(state.calMode === 'week'){
    const start = weekStartOf(state.calDate);
    navTitle = fmtDate(start).replace(/\s*\([^)]+\)/, '') + ' – ' + fmtDate(addDays(start,6)).replace(/\s*\([^)]+\)/, '');
    addDate = state.calDate;
  }else{
    navTitle = fmtDateFull(state.calDate);
    addDate = state.calDate;
  }

  let h = '<div class="page wide">';
  h += '<div class="page-title">달력</div>';
  h += '<div class="page-desc">훈련·감찰·휴가·회의 등 근무와 관련된 일정을 적어 둡니다. ' +
       '날짜를 누르면 일정·할 일을 넣을 수 있고, 매주·매월 반복되는 일정도 등록할 수 있습니다.</div>';

  h += '<div class="cal-head no-print">' +
    '<div class="seg">' + [['month','월간'],['week','주간'],['day','일간']].map(([k,l]) =>
      '<button class="' + (state.calMode === k ? 'on' : '') + '" data-act="cal-mode" data-val="' + k + '">' + l + '</button>').join('') + '</div>' +
    '<button class="btn sm" data-act="cal-move" data-val="-1">이전</button>' +
    '<div class="cal-title">' + esc(navTitle) + '</div>' +
    '<button class="btn sm" data-act="cal-move" data-val="1">다음</button>' +
    '<button class="btn sm ghost" data-act="cal-today">오늘</button>' +
    '<div class="spacer"></div>' +
    '<input type="search" id="cal-search" placeholder="일정 검색" value="' + esc(state.calSearchQuery) + '" style="width:130px">' +
    calColorFilterHTML() +
    (db.roles.length > 1 ? calRoleFilterHTML() : '') +
    '<button class="btn sm" data-act="leave-modal">휴가 등록</button>' +
    '<button class="btn sm primary" data-act="cal-day" data-date="' + addDate + '">일정 추가</button>' +
  '</div>';
  h += '<div class="cal-title" style="display:none;text-align:left;margin-bottom:10px" ' +
       'id="cal-print-title">' + esc(navTitle) + '</div>';

  h += '<div id="cal-body">' + renderCalBody() + '</div>';

  h += '</div>';
  return h;
}
function renderCalBody(){
  if(state.calSearchQuery.trim()) return calSearchResultsHTML();
  if(state.calMode === 'week') return renderCalWeek();
  if(state.calMode === 'day') return renderCalDay();
  return renderCalMonth();
}
/* 일정 제목·메모로 앞뒤 1년을 검색합니다. 결과를 누르면 그 날짜의 일간 보기로 이동합니다. */
function calSearchResultsHTML(){
  const q = state.calSearchQuery.trim().toLowerCase();
  const list = calFilter(eventsBetween(addDays(todayISO(), -365), addDays(todayISO(), 365)))
    .filter(e => (e.title + ' ' + (e.memo || '')).toLowerCase().indexOf(q) !== -1);
  let h = '<h2 class="sec">검색 결과 ' + list.length + '건</h2>';
  if(!list.length){ h += '<div class="empty">검색 결과가 없습니다.</div>'; return h; }
  list.forEach(e => {
    h += '<div class="row" data-act="cal-search-jump" data-date="' + e.date + '" style="cursor:pointer">' +
      '<span class="ev-dot ' + e.color + '" style="margin-top:0"></span>' +
      '<div class="grow"><div class="ttl">' + esc(e.title) + '</div>' +
        '<div class="card-meta"><span>' + esc(fmtDate(e.date)) + '</span>' +
        (e.time ? '<span>' + esc(e.time) + '</span>' : '<span>종일</span>') +
        (e.role !== 'both' && ROLES[e.role] ? '<span>' + esc(ROLES[e.role].name) + '</span>' : '') +
      '</div></div></div>';
  });
  return h;
}

function renderCalMonth(){
  const key = state.calMonth;
  const y = parseInt(key.slice(0,4),10), m = parseInt(key.slice(5,7),10);
  const first = new Date(y, m-1, 1);
  const lead = first.getDay();
  const total = new Date(y, m, 0).getDate();
  const weeks = Math.ceil((lead + total) / 7);
  const today = todayISO();
  const holMap = getHolidayMap(y);
  let h = '';

  h += '<div class="cal-grid"><div class="cal-wd">' +
    WEEKDAY.map((w,i) => '<div class="' + (i===0?'sun':(i===6?'sat':'')) + '">' + w + '</div>').join('') +
  '</div><div class="cal-days">';

  const start = addDays(key + '-01', -lead);
  for(let i = 0; i < weeks * 7; i++){
    const date = addDays(start, i);
    const dow = i % 7;
    const inMonth = date.slice(0,7) === key;
    const evs = calFilter(eventsOn(date));
    const tds = todosOn(date);
    const dateY = parseInt(date.slice(0,4),10);
    const hol = getHolidayMap(dateY)[date] || null;
    const lunar = lunarLabel(date);
    const cls = ['cal-cell'];
    if(!inMonth) cls.push('out');
    if(dow === 0 || hol) cls.push(dow === 0 ? 'sun' : '');
    if(hol) cls.push('holiday');
    else if(dow === 0) { /* already added */ }
    if(dow === 6 && !hol) cls.push('sat');
    if(date === today) cls.push('today');

    h += '<div class="' + cls.filter(Boolean).join(' ') + '" data-act="cal-day" data-date="' + date + '">';
    /* 날짜 + 음력 */
    h += '<div class="cal-d-wrap"><div class="cal-d">' + parseInt(date.slice(8),10) + '</div>';
    if(lunar) h += '<span class="cal-lunar">' + esc(lunar) + '</span>';
    h += '</div>';
    /* 공휴일 이름 */
    if(hol) h += '<div class="cal-hol">' + esc(hol) + '</div>';
    /* 일정 */
    var maxItems = hol ? 2 : 3;
    evs.slice(0,maxItems).forEach(function(e){
      h += '<div class="ev ' + e.color + '" data-act="ev-quick-del" data-id="' + e.id + '" data-date="' + date +
        '" title="' + esc(e.title) + ' — 클릭하면 이 일정 삭제">' +
        (e.time ? esc(e.time) + ' ' : '') + esc(e.title) + '</div>';
    });
    if(evs.length > maxItems) h += '<div class="cal-more">+' + (evs.length - maxItems) + '건</div>';
    /* 할 일 (최대 2개) */
    tds.slice(0,2).forEach(function(t){
      h += '<div class="cal-todo' + (t.done ? ' done' : '') + '">' +
        (t.done ? '✓ ' : '○ ') + esc(t.text) + '</div>';
    });
    if(tds.length > 2) h += '<div class="cal-more">+' + (tds.length - 2) + '건</div>';
    h += '</div>';
  }
  h += '</div></div>';

  /* 이 달의 일정을 목록으로도 보여 줍니다 */
  const monthEvents = calFilter(eventsBetween(key + '-01', key + '-' + String(total).padStart(2,'0')));
  h += '<h2 class="sec">' + m + '월 일정 ' + (monthEvents.length ? monthEvents.length + '건' : '') + '</h2>';
  if(!monthEvents.length){
    h += '<div class="empty">등록된 일정이 없습니다.</div>';
  }else{
    monthEvents.forEach(e => {
      const done = Array.isArray(e.doneDates) && e.doneDates.indexOf(e.date) !== -1;
      h += '<div class="row">' +
        '<input type="checkbox" data-act="ev-toggle-done" data-id="' + e.id + '" data-date="' + e.date + '"' +
          (done ? ' checked' : '') + ' title="완료로 표시">' +
        '<span class="ev-dot ' + e.color + '" style="margin-top:0"></span>' +
        '<div class="grow" data-act="cal-day" data-date="' + e.date + '" style="cursor:pointer">' +
          '<div class="ttl' + (done ? ' done' : '') + '">' + esc(e.title) +
          (e.repeat && e.repeat !== 'none' ? ' <span class="tiny faint">· ' + REPEAT_LABEL[e.repeat] + '</span>' : '') +
        '</div>' +
          '<div class="card-meta"><span>' + esc(fmtDate(e.date)) + '</span>' +
          (e.time ? '<span>' + esc(e.time) + '</span>' : '<span>종일</span>') +
          (e.role !== 'both' && ROLES[e.role] ? '<span>' + esc(ROLES[e.role].name) + '</span>' : '') +
          (e.memo ? '<span>' + esc(e.memo.length > 30 ? e.memo.slice(0,30) + '…' : e.memo) + '</span>' : '') +
        '</div></div></div>';
    });
  }

  /* 이 달의 공휴일 목록 */
  const monthHols = [];
  for(var d=1; d<=total; d++){
    var dd = key + '-' + String(d).padStart(2,'0');
    var hn = holMap[dd];
    if(hn) monthHols.push({date:dd, name:hn});
  }
  if(monthHols.length){
    h += '<h2 class="sec">' + m + '월 공휴일 ' + monthHols.length + '일</h2>';
    monthHols.forEach(function(ho){
      h += '<div class="row"><span class="ev-dot red" style="margin-top:0"></span>' +
        '<div class="grow"><div class="ttl" style="color:var(--red)">' + esc(ho.name) + '</div>' +
        '<div class="card-meta"><span>' + esc(fmtDate(ho.date)) + '</span>' +
        '<span>음력 ' + esc(lunarLabel(ho.date)) + '</span></div></div></div>';
    });
  }
  return h;
}

/* 주간 보기 — 요일마다 그날의 일정·할 일을 목록으로 보여줍니다. 실제 수정은 날짜를 눌러 하루 창에서 합니다. */
function renderCalWeek(){
  const start = weekStartOf(state.calDate);
  const today = todayISO();
  let h = '';
  for(let i = 0; i < 7; i++){
    const date = addDays(start, i);
    const evs = calFilter(eventsOn(date));
    const tds = todosOn(date);
    const hol = holidayName(date);
    h += '<div class="card click" data-act="cal-day" data-date="' + date + '" style="margin-bottom:8px' +
      (date === today ? ';border-color:var(--accent)' : '') + '">';
    h += '<div class="card-row" style="align-items:center;margin-bottom:6px;gap:8px">' +
      '<b' + (date === today ? ' style="color:var(--accent)"' : '') + '>' + esc(fmtDate(date)) + '</b>' +
      (date === today ? '<span class="tag blue">오늘</span>' : '') +
      (hol ? '<span class="tag red">' + esc(hol) + '</span>' : '') +
      '<span class="tiny faint">음력 ' + esc(lunarLabel(date)) + '</span>' +
    '</div>';
    if(!evs.length && !tds.length){
      h += '<div class="small faint">일정 없음</div>';
    }else{
      evs.forEach(e => { h += eventRowHTML(e); });
      tds.forEach(t => {
        h += '<div class="cal-todo' + (t.done ? ' done' : '') + '" style="font-size:12.5px;padding:2px 0">' +
          (t.done ? '✓ ' : '○ ') + esc(t.text) + '</div>';
      });
    }
    h += '</div>';
  }
  return h;
}

/* 일간 보기 — 하루치 일정·할 일을 크게 펼쳐 보여줍니다. */
function renderCalDay(){
  const date = state.calDate;
  const today = todayISO();
  const evs = calFilter(eventsOn(date));
  const tds = todosOn(date);
  const hol = holidayName(date);
  let h = '';
  h += '<div class="btn-row" style="margin-bottom:12px">' +
    (date === today ? '<span class="tag blue">오늘</span>' : '') +
    (hol ? '<span class="tag red">' + esc(hol) + '</span>' : '') +
    '<span class="tiny faint">음력 ' + esc(lunarLabel(date)) + '</span>' +
  '</div>';
  h += '<div class="card" style="padding:4px 14px">';
  if(!evs.length) h += '<div class="empty small">등록된 일정이 없습니다.</div>';
  else evs.forEach(e => { h += eventRowHTML(e); });
  h += '</div>';
  if(tds.length){
    h += '<h3 class="sub">할 일</h3><div class="card" style="padding:2px 14px">';
    tds.forEach(t => {
      h += '<div class="cal-todo' + (t.done ? ' done' : '') + '" style="padding:6px 0">' +
        (t.done ? '✓ ' : '○ ') + esc(t.text) + '</div>';
    });
    h += '</div>';
  }
  h += '<div class="btn-row" style="margin-top:14px">' +
    '<button class="btn primary sm" data-act="cal-day" data-date="' + date + '">일정·할 일 추가/수정</button></div>';
  return h;
}

/* 하루 일정 창 — 목록과 입력을 한 화면에 둡니다. */
const REPEAT_LABEL = { none:'반복 없음', daily:'매일', weekly:'매주', monthly:'매월' };
/* 일정 한 줄의 본문(제목·메모·직책·반복 표시)만 만듭니다. 하루 목록/주간·일간 보기에서 함께 씁니다. */
function eventBodyHTML(e){
  const done = Array.isArray(e.doneDates) && e.doneDates.indexOf(e.date) !== -1;
  return '<div class="ev-t' + (done ? ' done' : '') + '">' + (e.time ? '<span class="faint mono">' + esc(e.time) + '</span> ' : '') + esc(e.title) +
      (e.repeat && e.repeat !== 'none' ? '<span class="tiny faint"> · ' + REPEAT_LABEL[e.repeat] + ' 반복</span>' : '') +
    '</div>' +
    (e.memo ? '<div class="ev-m">' + esc(e.memo) + '</div>' : '') +
    (e.role !== 'both' && ROLES[e.role] ? '<div class="tiny faint">' + esc(ROLES[e.role].name) + ' 전용</div>' : '');
}
/* 주간/일간 보기에서 쓰는 한 줄. 체크박스를 누르면 완료로 표시(줄긋기)되고, 나머지를 누르면 그 날짜의 일정 창이 열립니다. */
function eventRowHTML(e){
  const done = Array.isArray(e.doneDates) && e.doneDates.indexOf(e.date) !== -1;
  return '<div class="ev-row">' +
    '<input type="checkbox" data-act="ev-toggle-done" data-id="' + e.id + '" data-date="' + e.date + '"' +
      (done ? ' checked' : '') + ' style="margin-top:6px" title="완료로 표시">' +
    '<span class="ev-dot ' + e.color + '"></span>' +
    '<div class="ev-body" data-act="cal-day" data-date="' + e.date + '" style="cursor:pointer">' + eventBodyHTML(e) + '</div>' +
  '</div>';
}
function openDayModal(date){
  const evs = eventsOn(date);
  const d = state.evDraft;
  const editing = d.editId ? getEvent(d.editId) : null;

  let body = '';
  if(evs.length){
    body += evs.map(e =>
      '<div class="ev-row">' +
        '<input type="checkbox" data-act="ev-toggle-done" data-id="' + e.id + '" data-date="' + date + '"' +
          (Array.isArray(e.doneDates) && e.doneDates.indexOf(date) !== -1 ? ' checked' : '') +
          ' style="margin-top:6px" title="완료로 표시">' +
        '<span class="ev-dot ' + e.color + '"></span>' +
        '<div class="ev-body">' + eventBodyHTML(e) + '</div>' +
        '<div class="ev-acts">' +
          '<button data-act="ev-edit" data-id="' + e.id + '" data-date="' + date + '">수정</button>' +
          (e.repeat && e.repeat !== 'none'
            ? '<button data-act="ev-del-one" data-id="' + e.id + '" data-date="' + date + '">이 날짜만 삭제</button>' +
              '<button data-act="ev-del" data-id="' + e.id + '" data-date="' + date + '">전체 삭제</button>'
            : '<button data-act="ev-del" data-id="' + e.id + '" data-date="' + date + '">삭제</button>') +
        '</div>' +
      '</div>').join('');
  }else{
    body += '<div class="small faint" style="padding:6px 4px 12px">등록된 일정이 없습니다.</div>';
  }

  /* 공휴일 / 음력 정보 */
  const hol = holidayName(date);
  const lunar = solarToLunar(date);
  if(hol || lunar){
    body += '<div style="padding:4px 0 8px;font-size:13px">';
    if(hol) body += '<span style="color:var(--red);font-weight:600">📅 ' + esc(hol) + '</span> ';
    if(lunar) body += '<span class="faint">음력 ' + (lunar.leap?'윤':'') + lunar.month + '월 ' + lunar.day + '일</span>';
    body += '</div>';
  }

  /* ── 할 일 (TODO) ── */
  body += '<div class="divider" style="margin:10px 0"></div>';
  body += '<div style="font-size:13px;font-weight:600;color:var(--text-dim);margin-bottom:6px">할 일</div>';
  const todos = todosOn(date);
  if(todos.length){
    todos.forEach(function(t){
      body += '<div class="todo-row">' +
        '<input type="checkbox" data-act="todo-toggle" data-id="' + t.id + '" data-date="' + date + '"' + (t.done ? ' checked' : '') + '>' +
        '<span class="todo-text' + (t.done ? ' done' : '') + '">' + esc(t.text) +
          (t.role !== 'both' && ROLES[t.role] ? ' <span class="tiny faint">· ' + esc(ROLES[t.role].name) + '</span>' : '') +
        '</span>' +
        '<button class="todo-del" data-act="todo-del" data-id="' + t.id + '" data-date="' + date + '">삭제</button>' +
      '</div>';
    });
  }else{
    body += '<div class="small faint" style="padding:4px 0 8px">등록된 할 일이 없습니다.</div>';
  }
  body += '<div style="display:flex;gap:6px;margin-top:8px">' +
    '<input type="text" id="todo-input" placeholder="할 일 입력" style="flex:1">' +
    (db.roles.length > 1 ? '<select id="todo-role" style="width:auto;max-width:120px">' + roleOptionsHTML('both', '구분 없음') + '</select>' : '') +
    '<button class="btn sm primary" data-act="todo-add" data-date="' + date + '">추가</button></div>';

  /* ── 일정 입력 폼 ── */
  body += '<div class="divider" style="margin:14px 0"></div>';
  body += '<div style="font-size:13px;font-weight:600;color:var(--text-dim);margin-bottom:6px">일정 등록</div>';
  body += '<div class="grid g2" style="gap:0 10px">' +
      f('시간 (비우면 종일)', '<input type="time" id="ev-time" value="' + esc(editing ? editing.time : '') + '">') +
      f('해당 근무', '<select id="ev-role">' + roleOptionsHTML(d.role, '구분 없음') + '</select>') +
    '</div>';
  body += f('일정 내용', '<input type="text" id="ev-title" placeholder="예) 대대 전투력 측정, 면회 통제" value="' +
    esc(editing ? editing.title : '') + '">');
  body += f('메모', '<input type="text" id="ev-memo" placeholder="비우셔도 됩니다" value="' +
    esc(editing ? editing.memo : '') + '">');
  body += '<div class="grid g2" style="gap:0 10px">' +
      f('반복', '<select id="ev-repeat">' + ['none','daily','weekly','monthly'].map(k =>
        '<option value="' + k + '"' + ((editing ? (editing.repeat || 'none') : 'none') === k ? ' selected' : '') +
        '>' + REPEAT_LABEL[k] + '</option>').join('') + '</select>') +
      f('반복 종료일 (비우면 계속)', '<input type="date" id="ev-repeat-until" value="' + esc(editing ? editing.repeatUntil : '') + '">') +
    '</div>';
  if(editing && editing.repeat && editing.repeat !== 'none'){
    body += f('적용 범위', '<div class="seg" id="ev-scope-seg">' +
      [['this','이 날짜만'],['series','전체 반복 일정']].map(([k,l]) =>
        '<button data-act="ev-scope" data-val="' + k + '" class="' + (d.scope === k ? 'on' : '') + '">' + l + '</button>').join('') +
      '</div>');
  }
  body += f('색상', '<div class="sw">' + EV_COLORS.map(c =>
    '<button data-act="ev-color" data-val="' + c + '" data-date="' + date + '" class="' +
    (d.color === c ? 'on' : '') + '"></button>').join('') + '</div>');

  const foot =
    (editing ? '<button class="btn" data-act="ev-cancel" data-date="' + date + '">수정 취소</button>' : '') +
    '<button class="btn" data-act="close-modal">닫기</button>' +
    '<button class="btn primary" data-act="ev-save" data-date="' + date + '">' +
      (editing ? '수정 완료' : '일정 추가') + '</button>';

  openModal(fmtDateFull(date), body, foot, () => {
    const t = $('#todo-input'); if(t) t.focus();
  });
}

/* ---------- 사용 설명서 ---------- */
function step(n, title, desc){
  return '<div class="step"><div class="step-n">' + n + '</div>' +
    '<div class="step-b"><div class="step-t">' + title + '</div>' +
    '<div class="step-d">' + desc + '</div></div></div>';
}
function table(head, rows){
  return '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
    head.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') +
    '</tbody></table></div>';
}

function viewGuide(){
  let h = '<div class="page">';
  h += '<div class="page-title">사용 설명서</div>';
  h += '<div class="page-desc">' + esc(db.roles.map(function(x){return x.name;}).join(' · ')) + ' 근무 인수인계 · 일정관리 프로그램</div>';

  h += '<div class="callout info">' +
    '지시사항은 한 번 등록해 두면 <b>완료 처리할 때까지 다음 근무자에게 자동으로 넘어갑니다.</b> ' +

/* ---------- 휴가 등록 ---------- */
/* 시작일~종료일 사이의 일수를 계산합니다 (당일 하루 휴가면 1일). */
function leaveDaysOf(startDate, endDate){
  return daysBetweenISO(startDate, endDate || startDate) + 1;
}
/* 휴가로 등록된 일정을 삭제할 때, 사용했던 일수를 그 직책의 남은 휴가에 되돌려줍니다. */
function restoreLeaveBalance(ev){
  if(!ev || !ev.leaveType || !LEAVE_TYPES[ev.leaveType]) return;
  const days = leaveDaysOf(ev.date, ev.endDate);
  if(!db.leaveBalances[ev.role]) db.leaveBalances[ev.role] = {};
  db.leaveBalances[ev.role][ev.leaveType] = (db.leaveBalances[ev.role][ev.leaveType] || 0) + days;
}
function leaveModal(){
  const today = todayISO();
  const body =
    f('휴가 종류', '<select id="lv-type">' + Object.keys(LEAVE_TYPES).map(k =>
      '<option value="' + k + '">' + esc(LEAVE_TYPES[k].label) + '</option>').join('') + '</select>') +
    '<div class="grid g2">' +
      f('시작일', '<input type="date" id="lv-start" value="' + today + '">') +
      f('종료일', '<input type="date" id="lv-end" value="' + today + '">') +
    '</div>' +
    f('메모', '<input type="text" id="lv-memo" placeholder="비우셔도 됩니다">') +
    '<div id="lv-hint" class="small muted"></div>';
  const foot =
    '<button class="btn" data-act="close-modal">취소</button>' +
    '<button class="btn primary" data-act="save-leave">휴가 등록</button>';
  openModal('휴가 등록', body, foot, () => {
    updateLeaveHint();
    ['lv-type','lv-start','lv-end'].forEach(id => {
      const el = $('#' + id);
      if(el) el.addEventListener('input', updateLeaveHint);
    });
  });
}
function updateLeaveHint(){
  const typeEl = $('#lv-type'), startEl = $('#lv-start'), endEl = $('#lv-end'), hint = $('#lv-hint');
  if(!typeEl || !startEl || !hint) return;
  const type = typeEl.value;
  const start = startEl.value, end = endEl.value || start;
  const bal = (db.leaveBalances[db.activeRole] || {})[type] || 0;
  if(!start){ hint.textContent = ''; return; }
  const days = Math.max(1, leaveDaysOf(start, end));
  hint.textContent = days + '일 사용 · 현재 남은 ' + LEAVE_TYPES[type].label + ' ' + bal + '일' +
    (days > bal ? ' — 남은 일수보다 많습니다.' : '');
  hint.style.color = days > bal ? 'var(--red)' : '';
}

/* ---------- 백업 ---------- */
function exportData(){
  db.lastBackupAt = new Date().toISOString();
  const blob = new Blob([JSON.stringify(db, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '인수인계_백업_' + todayISO() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  saveDB();
  render();
  toast('백업 파일을 내려받았습니다.');
}
function importData(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = () => {
    const file = input.files && input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed || !Array.isArray(parsed.sheets) || !Array.isArray(parsed.orders)) throw new Error('형식 오류');
        if(!confirm('현재 데이터를 백업 파일 내용으로 덮어씁니다. 계속할까요?')) return;
        db = normalize(Object.assign(freshDB(), parsed));
        saveDB();
        go('home');
        toast('백업을 불러왔습니다.');
      }catch(e){
        alert('올바른 백업 파일이 아닙니다.');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

/* 파일 하나를 만들어 바로 내려받습니다. */
function downloadFile(filename, content, mime){
  const blob = new Blob([content], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- 인계 기록 내보내기 (.csv) — 엑셀에서 바로 열립니다 ---------- */
function csvEscape(s){
  const str = String(s == null ? '' : s);
  return /[",\n]/.test(str) ? '"' + str.replace(/"/g,'""') + '"' : str;
}
function exportCSV(){
  if(!db.sheets.length){ toast('내보낼 인계 기록이 없습니다.'); return; }
  const header = ['날짜','직책','근무 구분','인계자','인수자','상태','점검 완료','점검 전체','지시사항 건수','반드시 전달할 사항','특이사항'];
  const rows = db.sheets.slice().sort((a,b) => a.date < b.date ? -1 : 1).map(s => {
    const roleName = ROLES[s.role] ? ROLES[s.role].name : s.role;
    const st = SHEET_STATUS[s.status] ? SHEET_STATUS[s.status].label : s.status;
    const doneChecks = s.checks.filter(c => c.ok).length;
    return [s.date, roleName, s.shift, s.outName, s.inName, st, doneChecks, s.checks.length, s.orderIds.length, s.keyMessage, s.notes];
  });
  const csv = [header].concat(rows).map(r => r.map(csvEscape).join(',')).join('\r\n');
  downloadFile('인계기록_' + todayISO() + '.csv', '\uFEFF' + csv, 'text/csv;charset=utf-8');
  toast('인계 기록을 CSV로 내보냈습니다.');
}

        b => b.classList.toggle('on', b.dataset.val === val));
    },
    'ev-edit': () => {
      const ev = getEvent(id);
      state.evDraft = { color:ev.color, role:ev.role, editId:ev.id, scope:'this' };
      openDayModal(el.dataset.date);
    },
    'ev-cancel': () => {
      state.evDraft = { color:'blue', role:'both', editId:null, scope:'series' };
      openDayModal(el.dataset.date);
    },
    'ev-del': () => {
      const target = getEvent(id);
      const isLeave = target && target.leaveType;
      if(!confirm(isLeave
        ? '이 휴가를 취소합니다. 사용했던 일수가 남은 휴가에 다시 더해집니다.'
        : '이 일정을 삭제합니다. 반복 일정이면 모든 날짜의 일정이 함께 삭제됩니다.')) return;

      db.events = db.events.filter(x => x.id !== id);

      saveDB();
      openDayModal(el.dataset.date);
      render();
      if(isLeave) toast('휴가를 취소하고 남은 일수를 되돌렸습니다.');
    },
    /* 일정을 완료로 표시/해제합니다(줄긋기). 반복 일정이면 그 날짜만 완료로 남습니다. */
    'ev-toggle-done': () => {
      const base = getEvent(id);
      if(!base) return;
      if(!Array.isArray(base.doneDates)) base.doneDates = [];
      const date = el.dataset.date;
      const i = base.doneDates.indexOf(date);
      if(i === -1) base.doneDates.push(date); else base.doneDates.splice(i,1);
      saveDB();
      if($('#modal-root').innerHTML.trim()) openDayModal(date);
      render();
    },
    'ev-del-one': () => {
      if(!confirm('이 날짜의 일정만 삭제합니다. 다른 날짜의 반복 일정은 그대로 남습니다.')) return;
      const base = getEvent(id);
      if(base){
        if(!Array.isArray(base.exceptions)) base.exceptions = [];
        if(base.exceptions.indexOf(el.dataset.date) === -1) base.exceptions.push(el.dataset.date);
      }
      saveDB();
      openDayModal(el.dataset.date);
      render();
    },
    /* 달력 칸의 작은 일정 박스를 바로 클릭해 지웁니다. 반복 일정이면 그 날짜만 지워집니다. */
    'ev-quick-del': () => {
      const ev = getEvent(id);
      if(!ev) return;
      const recurring = ev.repeat && ev.repeat !== 'none';
      const isLeave = !!ev.leaveType;
      if(!confirm(isLeave
        ? '\'' + ev.title + '\'를 취소합니다. 사용했던 일수가 남은 휴가에 다시 더해집니다.'
        : ('\'' + ev.title + '\' 일정을 삭제합니다.' +
          (recurring ? ' (이 날짜만 지워지고, 다른 날짜의 반복 일정은 남습니다.)' : '')))) return;
      if(recurring){
        if(!Array.isArray(ev.exceptions)) ev.exceptions = [];
        if(ev.exceptions.indexOf(el.dataset.date) === -1) ev.exceptions.push(el.dataset.date);
      }else{
        if(isLeave) restoreLeaveBalance(ev);
        db.events = db.events.filter(x => x.id !== id);
      }
      saveDB();
      render();
      toast(isLeave ? '휴가를 취소하고 남은 일수를 되돌렸습니다.' : '일정을 삭제했습니다.');
    },
    'ev-save': () => {
      const date = el.dataset.date;
      const title = $('#ev-title').value.trim();
      if(!title){ $('#ev-title').focus(); toast('일정 내용을 입력하십시오.'); return; }
      const data = {
        time: $('#ev-time').value,
        title: title,
        memo: $('#ev-memo').value.trim(),
        color: state.evDraft.color,
        role: $('#ev-role').value,
        repeat: $('#ev-repeat').value,
        repeatUntil: $('#ev-repeat-until').value,
      };
      const editId = state.evDraft.editId;
      /* 겹치는 일정 사고 방지 — 같은 날 같은 시각에 이미 다른 일정이 있으면 저장은 하되 알려줍니다. */
      const clash = data.time ? eventsOn(date).find(x => x.time === data.time && x.id !== editId) : null;
      let msg;
      if(editId){
        const base = getEvent(editId);
        if(base && base.repeat && base.repeat !== 'none' && state.evDraft.scope === 'this'){
          /* 이 날짜만 떼어내 독립된 일정으로 만들고, 원래 반복에서는 이 날짜를 건너뜁니다 */
          if(!Array.isArray(base.exceptions)) base.exceptions = [];
          if(base.exceptions.indexOf(date) === -1) base.exceptions.push(date);
          db.events.push(Object.assign(
            { id:uid(), date:date, exceptions:[], doneDates:[], createdAt:new Date().toISOString() },
            data, { repeat:'none', repeatUntil:'' }));
          msg = '이 날짜의 일정만 수정했습니다.';
        }else if(base){
          Object.assign(base, data);
          if(!Array.isArray(base.exceptions)) base.exceptions = [];
          msg = '일정을 수정했습니다.';
        }
      }else{
        db.events.push(Object.assign({ id:uid(), date:date, exceptions:[], doneDates:[], createdAt:new Date().toISOString() }, data));
        msg = '일정을 추가했습니다.';
      }
      if(clash) msg += ' (참고: ' + data.time + '에 \'' + clash.title + '\'와 시간이 겹칩니다)';
      state.evDraft = { color:'blue', role:'both', editId:null, scope:'series' };
      saveDB();
      openDayModal(date);
      render();
      toast(msg);
    },

    'todo-add': () => {
      const input = $('#todo-input');
      const text = input ? input.value.trim() : '';
      if(!text){ if(input) input.focus(); toast('할 일을 입력하십시오.'); return; }
      const roleSel = $('#todo-role');
      db.todos.push({ id:uid(), date:el.dataset.date, text:text, done:false,
        role: roleSel ? roleSel.value : 'both', createdAt:new Date().toISOString() });
      saveDB();
      openDayModal(el.dataset.date);
      render();
    },
    'todo-toggle': () => {
      const t = getTodo(id);
      if(t){ t.done = !t.done; saveDB(); openDayModal(el.dataset.date); render(); }
    },
    'todo-del': () => {
      db.todos = db.todos.filter(t => t.id !== id);
      saveDB();
      openDayModal(el.dataset.date);
      render();
    },

    'new-order': () => orderModal(null),
    'save-order': () => saveOrderFromModal(id),
    'leave-modal': leaveModal,
    'save-leave': () => {
      const type = $('#lv-type').value;
      const start = $('#lv-start').value;
      const end = $('#lv-end').value || start;
      if(!start){ toast('시작일을 입력하십시오.'); return; }
      if(end < start){ toast('종료일이 시작일보다 빠릅니다.'); return; }
      const days = leaveDaysOf(start, end);
      const role = db.activeRole;
      if(!db.leaveBalances[role]) db.leaveBalances[role] = {};
      const bal = db.leaveBalances[role][type] || 0;
      if(days > bal && !confirm('남은 ' + LEAVE_TYPES[type].label + '가 ' + bal + '일인데 ' + days + '일을 사용합니다. 그래도 등록할까요?')) return;
      const memo = $('#lv-memo').value.trim();
      db.events.push({
        id: uid(), date: start, endDate: end === start ? '' : end,
        time: '', title: LEAVE_TYPES[type].label + ' 휴가', memo: memo,
        color: LEAVE_TYPES[type].color, role: role, leaveType: type,
        repeat: 'none', repeatUntil: '', exceptions: [], doneDates: [],
        createdAt: new Date().toISOString(),
      });
      db.leaveBalances[role][type] = bal - days;
      saveDB();
      closeModal();
      render();
      toast(LEAVE_TYPES[type].label + ' ' + days + '일을 등록했습니다. (남은 ' + LEAVE_TYPES[type].label + ' ' + (bal - days) + '일)');
    },
    'edit-order': () => orderModal(getOrder(id)),
    'open-order': () => go('order', { orderId:id }),
    'order-filter': () => { state.orderFilter = val; render(); },

    'set-order-status': () => {
      const o = getOrder(id);
      setOrderStatus(o, val);
      render();
      toast(ORDER_STATUS[val].label + '(으)로 변경했습니다.');
    },
    'add-log': () => {
      const input = $('#log-note');
      const text = input.value.trim();
      if(!text) return;
      const o = getOrder(id);
      logOrder(o, text);
      saveDB();
      render();
    },
    'del-order': () => {
      if(!confirm('이 지시사항을 삭제합니다. 되돌릴 수 없습니다.')) return;
      deleteOrder(id);
      go('orders');
      toast('삭제했습니다.');
    },

    'start-handover': () => {
      const s = newSheet(db.activeRole);
      go('sheet', { sheetId:s.id });
    },
    'open-sheet': () => go('sheet', { sheetId:id }),

    'add-check': () => {
      const input = $('#new-check');
      const text = input.value.trim();
      if(!text) return;
      getSheet(state.sheetId).checks.push({ id:uid(), text:text, ok:false, note:'' });
      saveDB();
      render();
      const n = $('#new-check'); if(n) n.focus();
    },
    'del-check': () => {
      const s = getSheet(state.sheetId);
      s.checks = s.checks.filter(c => c.id !== id);
      saveDB();
      render();
    },
    'order-action': () => {
      const s = getSheet(state.sheetId);
      const info = s.orderNotes[id] || { action:'keep', note:'' };
      info.action = val;
      s.orderNotes[id] = info;
      saveDB();
      const seg = el.parentElement;
      Array.prototype.forEach.call(seg.children, b => b.classList.toggle('on', b.dataset.val === val));
    },
    'confirm-sheet': () => {
      const s = getSheet(id);
      if(!s.outName.trim() || !s.inName.trim()){
        toast('인계자와 인수자 이름을 먼저 입력하십시오.');
        return;
      }
      const unchecked = s.checks.filter(c => !c.ok).length;
      const keeping = s.orderIds.filter(oid => {
        const o = getOrder(oid);
        return o && o.status !== 'done' && (s.orderNotes[oid] || {}).action !== 'done';
      }).length;
      let msg = '인수인계를 완료 처리합니다.\n\n';
      if(unchecked) msg += '· 미확인 점검 항목 ' + unchecked + '개\n';
      msg += '· 다음 근무자에게 이월되는 지시사항 ' + keeping + '건\n\n완료 후에는 수정 모드로 되돌려야 편집할 수 있습니다.';
      if(!confirm(msg)) return;
      confirmSheet(s);
      render();
      toast('인수인계가 기록되었습니다.');
    },
    'reopen-sheet': () => {
      const s = getSheet(id);
      if(!confirm('수정 모드로 되돌립니다. 이미 반영된 지시사항 인계 횟수는 되돌아가지 않습니다.')) return;
      s.status = 'draft';
      saveDB();
      render();
    },
    'del-sheet': () => {
      if(!confirm('이 인계서를 삭제합니다. 되돌릴 수 없습니다.')) return;
      deleteSheet(id);
      go('records');
      toast('삭제했습니다.');
    },

    'add-tpl': () => {
      const input = $('#new-tpl');
      const text = input.value.trim();
      if(!text) return;
      db.templates[db.activeRole].push(text);
      saveDB();
      render();
      const n = $('#new-tpl'); if(n) n.focus();
    },
    'del-tpl': () => {
      db.templates[db.activeRole].splice(parseInt(el.dataset.idx,10), 1);
      saveDB();
      render();
    },
    'clear-tpl': () => {
      if(!confirm(role().name + ' 기본 점검 항목을 모두 지웁니다. 계속하시겠습니까?')) return;
      db.templates[db.activeRole] = [];
      saveDB();
      render();
    },
    'toggle-notify': () => {
      if(!db.notify){
        if(typeof Notification === 'undefined'){ toast('이 브라우저는 알림을 지원하지 않습니다.'); return; }
        Notification.requestPermission().then(perm => {
          db.notify = perm === 'granted';
          saveDB();
          render();
          toast(db.notify ? '알림을 켰습니다.' : '알림 권한이 허용되지 않았습니다.');
        });
        return;
      }
      db.notify = false;
      saveDB();
      render();
      toast('알림을 껐습니다.');
    },
    'wipe': () => {
      if(!confirm('저장된 모든 인계서와 지시사항을 삭제합니다. 계속할까요?')) return;
      if(!confirm('되돌릴 수 없습니다. 먼저 백업 파일을 받아 두는 것을 권장합니다. 계속하시겠습니까?')) return;
      db = normalize(freshDB());
      saveDB();
      go('home');
      toast('모든 데이터를 삭제했습니다.');
    },
  };
  if(handlers[act]){ e.preventDefault(); handlers[act](); }
});

/* 입력 반영 — 텍스트는 다시 그리지 않고 모델만 갱신해 포커스를 유지합니다. */
document.addEventListener('input', e => {
  const el = e.target;
  const spec = el.dataset.in;
  if(spec === undefined){
    if(el.id === 'rec-q'){
      state.recordQuery = el.value;
      const box = $('#rec-list');
      if(box) box.innerHTML = recordList();
    }else if(el.id === 'cal-search'){
      state.calSearchQuery = el.value;
      const box = $('#cal-body');
      if(box) box.innerHTML = renderCalBody();
    }
    return;
  }
  const parts = spec.split(':');
  const kind = parts[0];

  if(kind === 'sheet'){
    const s = getSheet(state.sheetId);
    if(!s) return;
    s[parts[1]] = el.value;
    if(parts[1] === 'outName' || parts[1] === 'inName'){
      const box = $('#sign-' + parts[1]);       /* 서명란을 즉시 갱신 */
      if(box) box.textContent = el.value || '—';
    }
    saveSoon();
  }else if(kind === 'check'){
    const s = getSheet(state.sheetId);
    if(!s) return;
    const c = s.checks.find(x => x.id === parts[1]);
    if(!c) return;
    if(parts[2] === 'ok'){
      c.ok = el.checked;
      el.closest('.check').classList.toggle('done', c.ok);
      const cnt = $('#check-count');
      if(cnt) cnt.textContent = s.checks.filter(x => x.ok).length + '/' + s.checks.length;
    }else{
      c.note = el.value;
    }
    saveSoon();
  }else if(kind === 'ordernote'){
    const s = getSheet(state.sheetId);
    if(!s) return;
    const info = s.orderNotes[parts[1]] || { action:'keep', note:'' };
    info.note = el.value;
    s.orderNotes[parts[1]] = info;
    saveSoon();
  }else if(kind === 'db'){
    if(parts[1] === 'shifts'){
      db.shifts = el.value.split('\n').map(x => x.trim()).filter(Boolean);
    }else if(parts[1] === 'notifyLeadMin'){
      db.notifyLeadMin = parseInt(el.value,10) || 5;
    }else{
      db[parts[1]] = el.value;
    }
    saveSoon();
  }else if(kind === 'tpl'){
    db.templates[db.activeRole][parseInt(parts[1],10)] = el.value;
    saveSoon();
  }else if(kind === 'rolename'){
    const r = ROLES[parts[1]];
    if(!r) return;
    r.name = el.value;
    r.mark = (el.value.trim() || '직책').slice(0,1);
    if(parts[1] === db.activeRole){
      const ws = $('.ws-title'); const badge = $('.ws-badge');   /* 사이드바 이름을 즉시 반영 */
      if(ws) ws.textContent = r.name;
      if(badge) badge.textContent = r.mark;
    }
    saveSoon();
  }else if(kind === 'leave'){
    if(!db.leaveBalances[db.activeRole]) db.leaveBalances[db.activeRole] = {};
    db.leaveBalances[db.activeRole][parts[1]] = Math.max(0, parseInt(el.value, 10) || 0);
    saveSoon();
  }
});
/* 조합 완료 시점의 최종 값을 확실히 반영합니다. */
document.addEventListener('compositionend', e => {
  const el = e.target;
  if(el && (el.dataset.in !== undefined || el.id === 'rec-q' || el.id === 'cal-search')){
    el.dispatchEvent(new Event('input', { bubbles:true }));
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if(el.id === 'cal-role-filter'){ state.calRoleFilter = el.value; render(); return; }
  if(el.dataset.in && el.type === 'checkbox') return; /* input 이벤트에서 처리됨 */
  if(el.dataset.in && (el.tagName === 'SELECT' || el.type === 'date')){
    /* select/date 는 input 이벤트로도 들어오지만 일부 브라우저 대비 */
    el.dispatchEvent(new Event('input', { bubbles:true }));
  }
});

/* Enter 로 빠르게 추가 (한글 조합 중이면 첫 Enter 는 글자 확정에 쓰입니다) */
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter' || isComposing(e)) return;
  const id = e.target.id;
  if(id === 'new-check')      $('[data-act="add-check"]').click();
  else if(id === 'new-tpl')   $('[data-act="add-tpl"]').click();
  else if(id === 'new-role')  $('[data-act="add-role"]').click();
  else if(id === 'log-note')  $('[data-act="add-log"]').click();
  else if(id === 'todo-input'){
    const btn = $('[data-act="todo-add"]');
    if(btn) btn.click();
  }
  else if(id === 'ev-title' || id === 'ev-memo'){
    const btn = $('[data-act="ev-save"]');
    if(btn) btn.click();
  }
  else if(id === 'm-title' || id === 'm-from'){
    const btn = $('[data-act="save-order"]');
    if(btn) btn.click();
  }
});

/* 전역 단축키 — 입력 중이거나 모달이 열려 있을 때는 글자 입력을 방해하지 않도록 무시합니다. */
document.addEventListener('keydown', e => {
  if(isComposing(e) || e.metaKey || e.ctrlKey || e.altKey) return;
  const active = document.activeElement;
  if(active && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) return;
  if($('#modal-root').innerHTML.trim()) return;
  if(e.key === 'n' || e.key === 'N'){
    e.preventDefault();
    orderModal(null);
  }else if(e.key === '/'){
    e.preventDefault();
    if(state.view === 'records'){ const i = $('#rec-q'); if(i) i.focus(); }
    else if(state.view === 'calendar'){ const i = $('#cal-search'); if(i) i.focus(); }
  }else if((e.key === 't' || e.key === 'T') && state.view === 'calendar'){
    e.preventDefault();
    state.calMonth = todayISO().slice(0,7);
    state.calDate = todayISO();
    render();
  }
});

/* ---------- 첫 실행 안내 ---------- */
function welcome(){
  const body =
    '<p class="small muted" style="margin-bottom:16px">' +
      '인터넷 없이 이 컴퓨터에서만 동작합니다. 처음 한 번만 설정하면 됩니다.</p>' +
    f('부대 / 소속 표기', '<input type="text" id="w-unit" placeholder="예) ○○연대 1대대">') +
    f('먼저 사용할 직책', '<select id="w-role">' + roleOptionsHTML(db.activeRole, null) + '</select>') +
    '<div class="tiny faint" style="margin-top:-8px">직책 이름을 바꾸거나 새 직책(간부·군무원 등)을 추가하는 것은 나중에 설정에서 할 수 있습니다.</div>' +
    '<div class="callout info small" style="margin-top:6px">' +
      '간부에게 지시를 받으면 그 자리에서 지시사항으로 등록하십시오. ' +
      '완료 처리 전까지 모든 인계서에 자동으로 포함되므로 누락되지 않습니다.' +
      '<div style="margin-top:6px">시작한 뒤 <b>설정</b>에서 근무 구분과 점검 항목을 먼저 등록하십시오. ' +
      '자세한 사용법은 좌측 메뉴 「사용 설명서」에 있습니다.</div></div>';
  openModal('초기 설정', body,
    '<button class="btn primary" id="w-ok">시작</button>', () => {
    const go2 = () => {
      db.unit = $('#w-unit').value.trim();
      db.activeRole = $('#w-role').value;
      saveDB();
      closeModal();
      render();
    };
    $('#w-ok').addEventListener('click', go2);
    $('#w-unit').addEventListener('keydown', ev => { if(ev.key === 'Enter' && !isComposing(ev)) go2(); });
    $('#w-unit').focus();
  });
}

/* ---------- 시작 ---------- */
(function init(){
  db = loadDB();
  let theme = 'light';
  try{ theme = localStorage.getItem(THEME_KEY) || 'light'; }catch(e){}
  applyTheme(theme);
  state.sidebarHidden = isNarrow();
  render();
  setInterval(checkNotifications, 60000);
  setTimeout(checkNotifications, 3000);
  window.addEventListener('resize', () => {
    const narrow = isNarrow();
    if(!narrow && state.sidebarHidden){ state.sidebarHidden = false; renderSidebar(); }
  });
  if(!db.unit && !db.sheets.length && !db.orders.length) welcome();
  /* 아직 저장되지 않은 입력이 있을 때만 저장합니다.
     무조건 저장하면, 창을 여러 개 띄워 둔 경우 오래된 창을 닫을 때
     다른 창에서 작업한 내용을 덮어쓰게 됩니다. */
  window.addEventListener('beforeunload', () => {
    if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; saveDB(); }
  });

  /* 다른 창에서 저장하면 이 창도 최신 내용으로 맞춥니다.
     단, 이 창에서 입력 중이거나 저장 대기 중이면 건드리지 않습니다. */
  window.addEventListener('storage', e => {
    if(e.key !== DB_KEY || !e.newValue || saveTimer) return;
    const el = document.activeElement;
    if(el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    try{
      db = normalize(JSON.parse(e.newValue));
      render();
    }catch(err){ /* 형식이 깨진 경우 현재 상태를 유지합니다 */ }
  });
})();

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>근무 인수인계 · Handover</title>
<style>
/* ===== 기본 토큰 (노션 계열 팔레트) ===== */
:root{
  --bg:#ffffff;
  --bg-sidebar:#fbfbfa;
  --bg-hover:rgba(55,53,47,.06);
  --bg-active:rgba(55,53,47,.09);
  --bg-input:#ffffff;
  --bg-card:#ffffff;
  --text:#37352f;
  --text-dim:#787774;
  --text-faint:#9b9a97;
  --border:#e9e9e7;
  --border-strong:#dcdcd9;
  --accent:#2383e2;
  --accent-soft:#e7f1fb;
  --red:#b91c1c;      --red-bg:#ffe9e5;
  --orange:#a14c11;   --orange-bg:#fbecdd;
  --yellow:#8a6d1f;   --yellow-bg:#fbf3db;
  --green:#1d6b3f;    --green-bg:#dcefe3;
  --blue:#1a5b9e;     --blue-bg:#ddebf4;
  --gray:#6b6a67;     --gray-bg:#eeedec;
  --shadow:0 1px 2px rgba(15,15,15,.06), 0 3px 8px rgba(15,15,15,.06);
  --radius:6px;
}
html[data-theme="dark"]{
  --bg:#191919;
  --bg-sidebar:#202020;
  --bg-hover:rgba(255,255,255,.055);
  --bg-active:rgba(255,255,255,.09);
  --bg-input:#252525;
  --bg-card:#1f1f1f;
  --text:#d4d4d4;
  --text-dim:#9b9b9b;
  --text-faint:#6f6f6f;
  --border:#2f2f2f;
  --border-strong:#3d3d3d;
  --accent:#2f8ce8;
  --accent-soft:#1c3345;
  --red:#ff7369;      --red-bg:#442a28;
  --orange:#ffa344;   --orange-bg:#43342a;
  --yellow:#ffdc49;   --yellow-bg:#413d26;
  --green:#4dab6d;    --green-bg:#243d2c;
  --blue:#529cca;     --blue-bg:#233a4c;
  --gray:#9b9b9b;     --gray-bg:#2e2e2e;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 3px 8px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Pretendard','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,'Segoe UI',
    'Malgun Gothic','맑은 고딕',Roboto,'Helvetica Neue',sans-serif;
  font-size:15px; line-height:1.6; color:var(--text); background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--accent);text-decoration:none}
::selection{background:rgba(35,131,226,.24)}

/* ===== 레이아웃 ===== */
.app{display:flex;height:100vh;overflow:hidden}

/* --- 사이드바 --- */
.sidebar{
  width:248px;flex:0 0 248px;background:var(--bg-sidebar);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  transition:margin-left .18s ease;
}
.sidebar.hidden{margin-left:-248px}
.ws{
  display:flex;align-items:center;gap:9px;padding:12px 12px 10px;cursor:pointer;
  border-radius:var(--radius);margin:6px 8px 2px;
}
.ws:hover{background:var(--bg-hover)}
.ws-badge{
  width:26px;height:26px;flex:0 0 26px;border-radius:5px;background:var(--accent);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
}
.ws-text{min-width:0;flex:1}
.ws-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-sub{font-size:11.5px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-caret{color:var(--text-faint);font-size:11px}

.nav{padding:6px 8px;overflow-y:auto;flex:1}
.nav-label{
  font-size:11.5px;font-weight:600;color:var(--text-faint);letter-spacing:.02em;
  padding:14px 8px 4px;
}
.nav-item{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:5px 8px;border-radius:var(--radius);color:var(--text-dim);
  font-size:14px;line-height:1.5;
}
.nav-item:hover{background:var(--bg-hover)}
.nav-item.on{background:var(--bg-active);color:var(--text);font-weight:500}
.nav-item .ic{width:17px;text-align:center;font-size:14px;flex:0 0 17px;opacity:.85}
.nav-item .cnt{
  margin-left:auto;font-size:11px;color:var(--text-faint);
  background:var(--bg-active);border-radius:9px;padding:0 6px;min-width:18px;text-align:center;
}
.nav-item .cnt.alert{background:var(--red-bg);color:var(--red);font-weight:600}
.sidebar-foot{padding:8px;border-top:1px solid var(--border);display:flex;gap:4px}
.sidebar-foot button{
  flex:1;padding:6px;border-radius:var(--radius);font-size:12px;color:var(--text-dim);
}
.sidebar-foot button:hover{background:var(--bg-hover)}

/* --- 본문 --- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{
  height:45px;flex:0 0 45px;display:flex;align-items:center;gap:8px;
  padding:0 14px;border-bottom:1px solid var(--border);background:var(--bg);
}
.topbar .crumb{font-size:14px;color:var(--text-dim);display:flex;align-items:center;gap:6px;min-width:0}
.topbar .crumb b{color:var(--text);font-weight:500}
.topbar .sep{color:var(--text-faint)}
.icon-btn{
  width:28px;height:28px;border-radius:var(--radius);display:flex;align-items:center;
  justify-content:center;color:var(--text-dim);font-size:15px;flex:0 0 28px;
}
.icon-btn:hover{background:var(--bg-hover)}
.spacer{flex:1}
.content{flex:1;overflow-y:auto}
.page{max-width:860px;margin:0 auto;padding:40px 56px 120px}
.page.wide{max-width:1040px}

/* ===== 타이포 ===== */
.page-title{
  font-size:38px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin-bottom:6px;
  display:flex;align-items:center;gap:12px;
}
.page-title .emoji{font-size:38px}
.page-desc{color:var(--text-dim);font-size:14.5px;margin-bottom:26px}
h2.sec{
  font-size:19px;font-weight:600;letter-spacing:-.01em;margin:32px 0 10px;
  display:flex;align-items:center;gap:8px;
}
h2.sec:first-of-type{margin-top:12px}
h3.sub{font-size:15px;font-weight:600;margin:20px 0 8px;color:var(--text)}
.muted{color:var(--text-dim)}
.faint{color:var(--text-faint)}
.tiny{font-size:12px}
.small{font-size:13px}
.mono{font-variant-numeric:tabular-nums}

/* ===== 컴포넌트 ===== */
.callout{
  display:flex;gap:12px;padding:14px 16px;border-radius:var(--radius);
  background:var(--gray-bg);margin:14px 0;font-size:14px;
}
.callout .cico{font-size:18px;line-height:1.3;flex:0 0 auto}
.callout.warn{background:var(--yellow-bg);color:var(--yellow)}
.callout.danger{background:var(--red-bg);color:var(--red)}
.callout.info{background:var(--blue-bg);color:var(--blue)}
.callout.ok{background:var(--green-bg);color:var(--green)}
.callout b{font-weight:600}

.card{
  border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card);
  padding:16px;margin-bottom:10px;
}
.card.click{cursor:pointer;transition:background .1s}
.card.click:hover{background:var(--bg-hover)}
.card-row{display:flex;align-items:flex-start;gap:12px}
.card-title{font-weight:600;font-size:15px;margin-bottom:3px;overflow-wrap:anywhere}
.card-meta{font-size:12.5px;color:var(--text-faint);display:flex;gap:10px;flex-wrap:wrap}

.grid{display:grid;gap:10px}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.grid.g4{grid-template-columns:repeat(4,1fr)}

.stat{border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;background:var(--bg-card)}
.stat .n{font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.stat .l{font-size:12.5px;color:var(--text-dim);margin-top:2px}
.stat.alert .n{color:var(--red)}
.stat.good .n{color:var(--green)}

.tag{
  display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;
  padding:1px 7px;border-radius:4px;background:var(--gray-bg);color:var(--gray);white-space:nowrap;
}
.tag.red{background:var(--red-bg);color:var(--red)}
.tag.orange{background:var(--orange-bg);color:var(--orange)}
.tag.yellow{background:var(--yellow-bg);color:var(--yellow)}
.tag.green{background:var(--green-bg);color:var(--green)}
.tag.blue{background:var(--blue-bg);color:var(--blue)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:6px 12px;border-radius:var(--radius);border:1px solid var(--border-strong);
  background:var(--bg-card);font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;
}
.btn:hover{background:var(--bg-hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:var(--border-strong)}
.btn.danger:hover{background:var(--red-bg)}
.btn.ghost{border-color:transparent;background:none;color:var(--text-dim)}
.btn.ghost:hover{background:var(--bg-hover)}
.btn.big{padding:9px 18px;font-size:15px}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.field{margin-bottom:14px}
.field > label{display:block;font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:5px}
input[type=text],input[type=date],input[type=time],input[type=search],select,textarea{
  width:100%;padding:7px 10px;border:1px solid var(--border-strong);border-radius:var(--radius);
  background:var(--bg-input);outline:none;font-size:14px;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
textarea{resize:vertical;min-height:84px;line-height:1.65}
select{cursor:pointer}
.inline-input{
  border:1px solid transparent;background:none;padding:2px 6px;border-radius:4px;width:100%;
}
.inline-input:hover{background:var(--bg-hover)}
.inline-input:focus{background:var(--bg-input);border-color:var(--accent)}

.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--radius);overflow:hidden}
.seg button{padding:5px 12px;font-size:13.5px;color:var(--text-dim);border-right:1px solid var(--border)}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--bg-hover)}
.seg button.on{background:var(--accent);color:#fff}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:3px 10px;border-radius:14px;font-size:13px;color:var(--text-dim);border:1px solid var(--border)}
.chip:hover{background:var(--bg-hover)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}

/* 체크리스트 */
.check{display:flex;align-items:flex-start;gap:10px;padding:6px 8px;border-radius:4px}
.check:hover{background:var(--bg-hover)}
.check input[type=checkbox]{
  width:16px;height:16px;margin-top:5px;flex:0 0 16px;accent-color:var(--accent);cursor:pointer;
}
.check .txt{flex:1;min-width:0;padding-top:2px}
.check.done .txt > .t{color:var(--text-dim)}
.check .note{
  border:none;background:none;font-size:13px;color:var(--text-dim);padding:1px 4px;
  border-radius:3px;width:100%;margin-top:1px;
}
.check .note:hover{background:var(--bg-hover)}
.check .note:focus{background:var(--bg-input);box-shadow:0 0 0 1px var(--accent)}
.check .del{opacity:0;color:var(--text-faint);font-size:13px;padding:2px 6px;border-radius:4px}
.check:hover .del{opacity:1}
.check .del:hover{background:var(--bg-hover);color:var(--red)}

/* 리스트 행 */
.row{
  display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--border);
}
.row:hover{background:var(--bg-hover)}
.row .grow{flex:1;min-width:0}
.row .ttl{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.empty{
  text-align:center;padding:50px 20px;color:var(--text-faint);border:1px dashed var(--border-strong);
  border-radius:var(--radius);
}
.empty .e{font-size:30px;display:block;margin-bottom:8px;opacity:.6}

.divider{height:1px;background:var(--border);margin:26px 0}

/* 모달 */
.modal-bg{
  position:fixed;inset:0;background:rgba(15,15,15,.45);display:flex;align-items:center;
  justify-content:center;z-index:50;padding:20px;
}
.modal{
  background:var(--bg);border-radius:8px;box-shadow:var(--shadow);width:100%;max-width:560px;
  max-height:86vh;display:flex;flex-direction:column;border:1px solid var(--border);
}
.modal-head{padding:18px 22px 6px;font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.modal-body{padding:10px 22px 4px;overflow-y:auto}
.modal-foot{padding:14px 22px 18px;display:flex;gap:8px;justify-content:flex-end}

/* 토스트 */
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);
  color:var(--bg);padding:9px 18px;border-radius:var(--radius);font-size:14px;z-index:100;
  box-shadow:var(--shadow);animation:pop .18s ease;
}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* 인계서 상세 */
.sheet-head{
  border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:20px;
  background:var(--bg-card);
}
.kv{display:grid;grid-template-columns:104px 1fr;gap:6px 14px;font-size:14px}
.kv .k{color:var(--text-faint);font-size:13px;padding-top:1px}
.sign{
  display:flex;gap:14px;flex-wrap:wrap;border-top:1px solid var(--border);margin-top:24px;padding-top:18px;
}
.sign-box{
  flex:1;min-width:200px;border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;
}
.sign-box .role{font-size:12px;color:var(--text-faint);margin-bottom:4px}
.sign-box .nm{font-size:16px;font-weight:600}
.sign-box .at{font-size:12px;color:var(--text-faint);margin-top:4px}

.order-body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.7}
.timeline{border-left:2px solid var(--border);margin-left:5px;padding-left:16px}
.tl-item{position:relative;padding:4px 0 12px;font-size:13.5px}
.tl-item::before{
  content:'';position:absolute;left:-21px;top:11px;width:8px;height:8px;border-radius:50%;
  background:var(--border-strong);
}
.tl-item .when{color:var(--text-faint);font-size:12px}

/* 반응형 */
@media (max-width:820px){
  .sidebar{position:absolute;z-index:30;height:100%;box-shadow:var(--shadow)}
  .page{padding:26px 18px 100px}
  .page-title{font-size:29px}
  .grid.g4{grid-template-columns:repeat(2,1fr)}
  .grid.g3{grid-template-columns:1fr}
  .grid.g2{grid-template-columns:1fr}
}

/* 인쇄 */
@media print{
  .sidebar,.topbar,.no-print,.toast,.modal-bg{display:none !important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .app,.main,.content{display:block;height:auto;overflow:visible}
  .page{max-width:none;padding:0}
  body{font-size:11.5pt;color:#000;background:#fff}
  .card,.sheet-head,.sign-box,.check{border-color:#bbb;break-inside:avoid}
  h2.sec{break-after:avoid}
  .check.done .txt > .t{color:#000}
  .content{padding:0}
  .page-title{font-size:21pt}
  a{color:#000}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="content" id="content"></div>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
"use strict";
/* ============================================================
   근무 인수인계 프로그램 (위병조장 / 당직병)
   - 완전 로컬 실행: 브라우저 localStorage에만 저장됩니다.
   - 외부 통신 없음. 파일 하나로 동작합니다.
   ============================================================ */

/* ---------- 상수 ---------- */
const DB_KEY = 'shdex.handover.v1';
const THEME_KEY = 'shdex.theme';

const ROLES = {
  guard: { key:'guard', name:'위병조장', emoji:'🛡️', short:'위병' },
  duty:  { key:'duty',  name:'당직병',   emoji:'🌙', short:'당직' },
};

const PRIORITY = {
  urgent: { key:'urgent', label:'긴급', cls:'red',    rank:0 },
  high:   { key:'high',   label:'중요', cls:'orange', rank:1 },
  normal: { key:'normal', label:'일반', cls:'gray',   rank:2 },
};

const ORDER_STATUS = {
  open:    { key:'open',    label:'진행 중', cls:'blue' },
  hold:    { key:'hold',    label:'보류',    cls:'yellow' },
  done:    { key:'done',    label:'완료',    cls:'green' },
};

const SHEET_STATUS = {
  draft:     { key:'draft',     label:'작성 중',   cls:'gray' },
  handed:    { key:'handed',    label:'인계 완료', cls:'blue' },
  confirmed: { key:'confirmed', label:'인수 확인', cls:'green' },
};

/* 기본 점검 항목 — 설정에서 자유롭게 수정할 수 있습니다. */
const DEFAULT_TEMPLATES = {
  guard: [
    '근무 편성표 및 차기 근무자 투입 확인',
    '총기·탄약(공포탄 포함) 수량 및 시건 상태 확인',
    '무전기·전화기 통신 상태 확인 (감도 교신 완료)',
    'CCTV 및 모니터 정상 작동 확인',
    '출입증·방문객 대장 정리 상태 확인',
    '차량 출입 기록 및 미반납 출입증 확인',
    '위병소 비품·청결 상태 확인',
    '열쇠(열쇠 대장) 수량 확인 후 인계',
    '비상연락망 및 상황보고 계통 숙지',
    '미완료 지시사항 구두 재확인',
  ],
  duty: [
    '당직사령·당직부사관 지시사항 확인',
    '인원 현황(총원 / 현재원 / 열외) 확인',
    '외출·외박·휴가 인원 및 복귀 예정 시간 확인',
    '환자·관심 인원 특이사항 확인',
    '전화 수신 내역 및 전달사항 기록 확인',
    '상황일지 작성 상태 확인',
    '생활관 소등·점호 결과 확인',
    '탄약고·주요 시설 순찰 기록 확인',
    '당직 비품 및 열쇠 인수',
    '미완료 지시사항 구두 재확인',
  ],
};

const DEFAULT_SHIFTS = ['주간 (08:00~18:00)', '야간 (18:00~24:00)', '심야 (00:00~08:00)'];

/* ---------- 저장소 ---------- */
function freshDB(){
  return {
    version: 1,
    unit: '',
    activeRole: 'guard',
    templates: { guard: DEFAULT_TEMPLATES.guard.slice(), duty: DEFAULT_TEMPLATES.duty.slice() },
    shifts: DEFAULT_SHIFTS.slice(),
    orders: [],
    sheets: [],
    lastNames: { guard:'', duty:'' },
    createdAt: new Date().toISOString(),
  };
}

let db;
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return freshDB();
    const parsed = JSON.parse(raw);
    const base = freshDB();
    return normalize(Object.assign(base, parsed, {
      templates: Object.assign(base.templates, parsed.templates || {}),
      lastNames: Object.assign(base.lastNames, parsed.lastNames || {}),
    }));
  }catch(e){
    console.error('저장 데이터를 읽지 못했습니다.', e);
    return freshDB();
  }
}
/* 백업 파일이나 예전 버전에서 빠진 값을 채워, 화면이 깨지지 않게 합니다. */
function normalize(d){
  if(!Array.isArray(d.orders)) d.orders = [];
  if(!Array.isArray(d.sheets)) d.sheets = [];
  if(!Array.isArray(d.shifts) || !d.shifts.length) d.shifts = DEFAULT_SHIFTS.slice();
  d.orders.forEach(o => {
    o.relayCount = o.relayCount || 0;
    o.priority = PRIORITY[o.priority] ? o.priority : 'normal';
    o.status = ORDER_STATUS[o.status] ? o.status : 'open';
    if(!Array.isArray(o.log)) o.log = [];
  });
  d.sheets.forEach(s => {
    if(!Array.isArray(s.checks)) s.checks = [];
    if(!Array.isArray(s.orderIds)) s.orderIds = [];
    if(!s.orderNotes || typeof s.orderNotes !== 'object') s.orderNotes = {};
    s.status = SHEET_STATUS[s.status] ? s.status : 'draft';
    ['outName','inName','notes','keyMessage','shift','date'].forEach(k => { if(typeof s[k] !== 'string') s[k] = ''; });
  });
  if(!ROLES[d.activeRole]) d.activeRole = 'guard';
  return d;
}

let saveWarned = false;
function saveDB(){
  try{
    localStorage.setItem(DB_KEY, JSON.stringify(db));
  }catch(e){
    if(!saveWarned){
      saveWarned = true;
      alert('저장에 실패했습니다. 브라우저 저장 공간이 가득 찼거나 차단되어 있을 수 있습니다.\n설정 > 데이터에서 백업 파일을 내려받아 주세요.');
    }
  }
}

/* ---------- 유틸 ---------- */
const $ = (sel, root) => (root || document).querySelector(sel);
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function todayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function nowTime(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
const WEEKDAY = ['일','월','화','수','목','금','토'];
function fmtDate(iso){
  if(!iso) return '-';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + WEEKDAY[d.getDay()] + ')';
}
function fmtStamp(isoStamp){
  if(!isoStamp) return '-';
  const d = new Date(isoStamp);
  if(isNaN(d)) return '-';
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' +
    String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function daysSince(isoStamp){
  if(!isoStamp) return 0;
  const diff = Date.now() - new Date(isoStamp).getTime();
  return Math.max(0, Math.floor(diff / 86400000));
}
function relative(isoStamp){
  if(!isoStamp) return '';
  const mins = Math.floor((Date.now() - new Date(isoStamp).getTime()) / 60000);
  if(mins < 1) return '방금';
  if(mins < 60) return mins + '분 전';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs + '시간 전';
  return Math.floor(hrs/24) + '일 전';
}
function toast(msg){
  const root = $('#toast-root');
  root.innerHTML = '<div class="toast">' + esc(msg) + '</div>';
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ root.innerHTML = ''; }, 2200);
}

/* ---------- 데이터 조회 ---------- */
function role(){ return ROLES[db.activeRole] || ROLES.guard; }
function ordersFor(roleKey){
  return db.orders.filter(o => o.role === roleKey || o.role === 'both');
}
function openOrders(roleKey){
  return ordersFor(roleKey)
    .filter(o => o.status !== 'done')
    .sort((a,b) => (PRIORITY[a.priority].rank - PRIORITY[b.priority].rank) ||
                   (b.relayCount - a.relayCount) ||
                   (a.createdAt < b.createdAt ? -1 : 1));
}
function sheetsFor(roleKey){
  return db.sheets.filter(s => s.role === roleKey)
    .sort((a,b) => (b.date + (b.startTime||'')) < (a.date + (a.startTime||'')) ? -1 : 1);
}
function getSheet(id){ return db.sheets.find(s => s.id === id); }
function getOrder(id){ return db.orders.find(o => o.id === id); }
/* 3회 이상 인계되었는데도 끝나지 않은 지시 = 간부가 다시 말해야 하는 상황 */
function stalled(roleKey){
  return openOrders(roleKey).filter(o => o.relayCount >= 3);
}
function draftSheet(roleKey){
  return db.sheets.find(s => s.role === roleKey && s.status === 'draft');
}

/* ---------- 동작 ---------- */
function newSheet(roleKey){
  const existing = draftSheet(roleKey);
  if(existing) return existing;
  const sheet = {
    id: uid(),
    role: roleKey,
    date: todayISO(),
    shift: db.shifts[0] || '',
    startTime: nowTime(),
    endTime: '',
    outName: db.lastNames[roleKey] || '',
    inName: '',
    checks: (db.templates[roleKey] || []).map(t => ({ id:uid(), text:t, ok:false, note:'' })),
    orderIds: openOrders(roleKey).map(o => o.id),
    orderNotes: {},
    notes: '',
    keyMessage: '',
    status: 'draft',
    createdAt: new Date().toISOString(),
    handedAt: null,
    confirmedAt: null,
  };
  db.sheets.push(sheet);
  saveDB();
  return sheet;
}

function addOrder(data){
  const order = {
    id: uid(),
    role: data.role || db.activeRole,
    title: (data.title || '').trim(),
    body: (data.body || '').trim(),
    from: (data.from || '').trim(),
    priority: data.priority || 'normal',
    status: 'open',
    due: data.due || '',
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    relayCount: 0,
    log: [{ at:new Date().toISOString(), text:'지시사항 등록' + (data.from ? ' · 지시: ' + data.from.trim() : '') }],
  };
  db.orders.push(order);
  /* 작성 중인 인계서가 있으면 즉시 포함시켜, 다음 근무자가 반드시 보게 합니다. */
  const d = draftSheet(order.role === 'both' ? db.activeRole : order.role);
  if(d && d.orderIds.indexOf(order.id) === -1) d.orderIds.push(order.id);
  saveDB();
  return order;
}

function logOrder(order, text){
  order.log.push({ at:new Date().toISOString(), text:text });
  order.updatedAt = new Date().toISOString();
}

function setOrderStatus(order, status, note){
  if(order.status === status && !note) return;
  order.status = status;
  logOrder(order, (ORDER_STATUS[status] ? ORDER_STATUS[status].label + '(으)로 변경' : status) + (note ? ' · ' + note : ''));
  saveDB();
}

/* 인수 확인 — 인계 기록을 확정하고 지시사항 상태를 갱신합니다. */
function confirmSheet(sheet){
  sheet.status = 'confirmed';
  sheet.confirmedAt = new Date().toISOString();
  if(!sheet.handedAt) sheet.handedAt = sheet.confirmedAt;
  if(!sheet.endTime) sheet.endTime = nowTime();
  db.lastNames[sheet.role] = sheet.inName || db.lastNames[sheet.role];

  sheet.orderIds.forEach(oid => {
    const order = getOrder(oid);
    if(!order || order.status === 'done') return;
    const info = sheet.orderNotes[oid] || {};
    if(info.action === 'done'){
      order.status = 'done';
      logOrder(order, '완료 처리 · ' + (sheet.outName || '인계자') + (info.note ? ' · ' + info.note : ''));
    }else{
      order.relayCount = (order.relayCount || 0) + 1;
      logOrder(order, (order.relayCount) + '회차 인계 · ' + (sheet.outName || '?') + ' → ' + (sheet.inName || '?') +
        (info.note ? ' · ' + info.note : ''));
    }
  });
  saveDB();
}

function deleteSheet(id){
  db.sheets = db.sheets.filter(s => s.id !== id);
  saveDB();
}
function deleteOrder(id){
  db.orders = db.orders.filter(o => o.id !== id);
  db.sheets.forEach(s => { s.orderIds = s.orderIds.filter(x => x !== id); });
  saveDB();
}

/* ---------- 홈 ---------- */
function viewHome(){
  const r = role();
  const open = openOrders(r.key);
  const stall = stalled(r.key);
  const sheets = sheetsFor(r.key);
  const last = sheets.find(s => s.status !== 'draft');
  const d = draftSheet(r.key);
  const urgent = open.filter(o => o.priority === 'urgent' || o.priority === 'high');
  const overdue = open.filter(o => o.due && o.due < todayISO());

  let h = '<div class="page">';
  h += '<div class="page-title"><span class="emoji">' + r.emoji + '</span>' + esc(r.name) + ' 인수인계</div>';
  h += '<div class="page-desc">' + esc(db.unit || '부대명을 설정에서 입력하세요') + ' · ' + fmtDate(todayISO()) + '</div>';

  /* 경고 배너 — 같은 지시를 반복해서 받고 있는 상태 */
  if(stall.length){
    h += '<div class="callout danger"><span class="cico">🔁</span><div>' +
      '<b>' + stall.length + '건</b>의 지시사항이 <b>3회 이상 인계</b>되었는데도 아직 처리되지 않았습니다. ' +
      '간부가 같은 말을 다시 하게 되는 항목입니다 — 이번 근무에서 먼저 정리하세요.' +
      '<div style="margin-top:8px"><button class="btn sm" data-act="go" data-view="orders">확인하러 가기</button></div>' +
      '</div></div>';
  }
  if(d){
    h += '<div class="callout info"><span class="cico">✍️</span><div>' +
      '작성 중인 인계서가 있습니다. (' + esc(fmtDate(d.date)) + ' · ' + esc(d.shift || '시간 미지정') + ')' +
      '<div style="margin-top:8px"><button class="btn sm primary" data-act="open-sheet" data-id="' + d.id + '">이어서 작성</button></div>' +
      '</div></div>';
  }

  h += '<div class="grid g4" style="margin:20px 0 6px">' +
    stat(open.length, '미완료 지시사항', open.length ? 'alert' : 'good') +
    stat(urgent.length, '긴급·중요') +
    stat(overdue.length, '기한 경과', overdue.length ? 'alert' : '') +
    stat(sheets.filter(s=>s.status==='confirmed').length, '누적 인계 건수') +
  '</div>';

  h += '<div class="btn-row" style="margin:22px 0 4px">' +
    '<button class="btn primary big" data-act="start-handover">✍️ ' + (d ? '인계서 이어쓰기' : '인계서 작성 시작') + '</button>' +
    '<button class="btn big" data-act="new-order">＋ 지시사항 등록</button>' +
  '</div>';

  /* 지금 챙겨야 할 것 */
  h += '<h2 class="sec">🔥 지금 챙겨야 할 것</h2>';
  const focus = open.slice(0, 6);
  if(!focus.length){
    h += '<div class="empty"><span class="e">✅</span>미완료 지시사항이 없습니다. 깨끗하게 인계된 상태입니다.</div>';
  }else{
    focus.forEach(o => { h += orderCard(o); });
    if(open.length > focus.length){
      h += '<button class="btn ghost sm" data-act="go" data-view="orders">전체 ' + open.length + '건 보기 →</button>';
    }
  }

  /* 최근 인계 */
  h += '<h2 class="sec">🕘 최근 인계</h2>';

  if(!recent.length){
    h += '<div class="empty"><span class="e">📭</span>아직 인계 기록이 없습니다. 첫 인계서를 작성해 보세요.</div>';
  }else{

function stat(n, label, cls){
  return '<div class="stat ' + (cls||'') + '"><div class="n mono">' + n + '</div><div class="l">' + esc(label) + '</div></div>';
}

function orderCard(o){
  const p = PRIORITY[o.priority] || PRIORITY.normal;
  const st = ORDER_STATUS[o.status] || ORDER_STATUS.open;
  const late = o.due && o.due < todayISO() && o.status !== 'done';
  return '<div class="card click" data-act="open-order" data-id="' + o.id + '">' +
    '<div class="card-row"><div style="flex:1;min-width:0">' +
      '<div class="card-title">' + esc(o.title) + '</div>' +
      (o.body ? '<div class="small muted" style="margin-bottom:6px;overflow-wrap:anywhere">' +
        esc(o.body.length > 110 ? o.body.slice(0,110) + '…' : o.body) + '</div>' : '') +
      '<div class="card-meta">' +
        '<span class="tag ' + p.cls + '">' + p.label + '</span>' +
        '<span class="tag ' + st.cls + '">' + st.label + '</span>' +
        (o.role === 'both' ? '<span class="tag">공통</span>' : '') +
        (o.from ? '<span>지시: ' + esc(o.from) + '</span>' : '') +
        (o.due ? '<span' + (late ? ' style="color:var(--red);font-weight:600"' : '') + '>기한 ' + esc(fmtDate(o.due)) + (late ? ' · 경과' : '') + '</span>' : '') +
        (o.relayCount >= 3 ? '<span class="tag red">🔁 ' + o.relayCount + '회 인계됨</span>' :
          (o.relayCount ? '<span>' + o.relayCount + '회 인계</span>' : '<span>신규</span>')) +
      '</div>' +
    '</div></div></div>';
}

function sheetRow(s){
  const st = SHEET_STATUS[s.status] || SHEET_STATUS.draft;
  const doneChecks = s.checks.filter(c => c.ok).length;
  return '<div class="row" data-act="open-sheet" data-id="' + s.id + '" style="cursor:pointer">' +
    '<div class="grow">' +
      '<div class="ttl">' + esc(fmtDate(s.date)) + ' · ' + esc(s.shift || '시간 미지정') + '</div>' +
      '<div class="card-meta"><span>' + esc(s.outName || '?') + ' → ' + esc(s.inName || '?') + '</span>' +
      '<span>점검 ' + doneChecks + '/' + s.checks.length + '</span>' +

    '</div>' +
    '<span class="tag ' + st.cls + '">' + st.label + '</span>' +

      f('근무 구분', '<select data-in="sheet:shift">' +
        db.shifts.map(x => '<option' + (x === s.shift ? ' selected' : '') + '>' + esc(x) + '</option>').join('') +
        (db.shifts.indexOf(s.shift) === -1 && s.shift ? '<option selected>' + esc(s.shift) + '</option>' : '') +
        '</select>') +
      f('인계자 (나가는 근무자)', '<input type="text" data-in="sheet:outName" placeholder="계급 / 성명" value="' + esc(s.outName) + '">') +
      f('인수자 (들어오는 근무자)', '<input type="text" data-in="sheet:inName" placeholder="계급 / 성명" value="' + esc(s.inName) + '">') +
    '</div>';
  }else{
    h += '<div class="kv">' +
      '<div class="k">근무일자</div><div>' + esc(fmtDate(s.date)) + '</div>' +
      '<div class="k">근무 구분</div><div>' + esc(s.shift || '-') + '</div>' +
      '<div class="k">인계자</div><div>' + esc(s.outName || '-') + '</div>' +
      '<div class="k">인수자</div><div>' + esc(s.inName || '-') + '</div>' +
    '</div>';
  }
  h += '</div>';

  /* 1. 점검 항목 */
  h += '<h2 class="sec">① 점검 항목 <span class="tiny faint mono" id="check-count">' + checked + '/' + s.checks.length + '</span></h2>';
  if(!s.checks.length){
    h += '<div class="empty small"><span class="e">📝</span>점검 항목이 없습니다. 설정에서 기본 항목을 추가할 수 있습니다.</div>';
  }
  s.checks.forEach(c => {
    h += '<div class="check' + (c.ok ? ' done' : '') + '">' +
      '<input type="checkbox" data-in="check:' + c.id + ':ok"' + (c.ok ? ' checked' : '') + (editable ? '' : ' disabled') + '>' +
      '<div class="txt"><div class="t">' + esc(c.text) + '</div>' +
        (editable
          ? '<input class="note" data-in="check:' + c.id + ':note" placeholder="비고 (수량, 특이사항 등)" value="' + esc(c.note) + '">'
          : (c.note ? '<div class="note" style="color:var(--text-dim)">' + esc(c.note) + '</div>' : '')) +
      '</div>' +
      (editable ? '<button class="del" data-act="del-check" data-id="' + c.id + '" title="삭제">✕</button>' : '') +
    '</div>';
  });
  if(editable){
    h += '<div class="btn-row" style="margin-top:8px">' +
      '<input type="text" id="new-check" placeholder="점검 항목 추가 후 Enter" style="max-width:340px">' +
      '<button class="btn sm" data-act="add-check">추가</button></div>';
  }

  /* 2. 지시사항 인계 — 핵심 */
  h += '<h2 class="sec">② 지시사항 인계 <span class="tiny faint">' + orders.length + '건</span></h2>';
  h += '<div class="callout info small no-print"><span class="cico">📌</span><div>' +
    '완료로 표시하지 않은 항목은 <b>다음 근무자에게 그대로 넘어갑니다.</b> ' +
    '처리했다면 반드시 완료로 바꿔 주세요.</div></div>';
  if(!orders.length){
    h += '<div class="empty small"><span class="e">✅</span>인계할 미완료 지시사항이 없습니다.</div>';
  }
  orders.forEach(o => {
    const info = s.orderNotes[o.id] || { action:'keep', note:'' };
    const p = PRIORITY[o.priority] || PRIORITY.normal;
    h += '<div class="card">' +
      '<div class="card-row"><div style="flex:1;min-width:0">' +
        '<div class="card-title">' + esc(o.title) + '</div>' +
        (o.body ? '<div class="small muted order-body" style="margin:4px 0 6px">' + esc(o.body) + '</div>' : '') +
        '<div class="card-meta" style="margin-bottom:' + (editable ? '10px' : '0') + '">' +
          '<span class="tag ' + p.cls + '">' + p.label + '</span>' +
          (o.from ? '<span>지시: ' + esc(o.from) + '</span>' : '') +
          (o.due ? '<span>기한 ' + esc(fmtDate(o.due)) + '</span>' : '') +
          (o.relayCount >= 3 ? '<span class="tag red">🔁 ' + o.relayCount + '회 인계됨</span>' :
            (o.relayCount ? '<span>' + o.relayCount + '회 인계</span>' : '')) +
        '</div>' +
        (editable
          ? '<div class="btn-row">' +
              '<div class="seg" data-group="order-action">' +
                ['keep','done','hold'].map(a => {
                  const lbl = a === 'keep' ? '계속 인계' : (a === 'done' ? '✓ 완료' : '보류');
                  const on = (info.action || 'keep') === a;
                  return '<button class="' + (on ? 'on' : '') + '" data-act="order-action" data-id="' + o.id + '" data-val="' + a + '">' + lbl + '</button>';
                }).join('') +
              '</div>' +
              '<input type="text" data-in="ordernote:' + o.id + '" placeholder="진행 상황 / 인계 멘트" value="' + esc(info.note || '') + '" style="flex:1;min-width:180px">' +
            '</div>'
          : (info.note ? '<div class="small muted">→ ' + esc(info.note) + '</div>' : '')) +
      '</div></div></div>';
  });
  if(editable){
    h += '<button class="btn sm" data-act="new-order">＋ 이번 근무에 받은 지시 추가</button>';
  }

  /* 3. 반드시 전달 */
  h += '<h2 class="sec">③ 반드시 전달할 사항</h2>';
  if(editable){
    h += '<textarea data-in="sheet:keyMessage" placeholder="다음 근무자가 이것만은 꼭 알아야 한다 — 한두 줄로 적으세요.&#10;예) 23시 이후 정문 보수공사 차량 2대 출입 예정, 간부 확인 후 통과">' + esc(s.keyMessage) + '</textarea>';
  }else{
    h += s.keyMessage
      ? '<div class="callout warn"><span class="cico">📣</span><div class="order-body">' + esc(s.keyMessage) + '</div></div>'
      : '<div class="small faint">기재 없음</div>';
  }

  /* 4. 특이사항 */
  h += '<h2 class="sec">④ 근무 중 특이사항</h2>';
  if(editable){
    h += '<textarea data-in="sheet:notes" style="min-height:140px" placeholder="시간대별로 기록하면 좋습니다.&#10;예) 19:40 대대 상황실 유선 — 금일 훈련 미복귀 인원 없음 확인&#10;21:10 외부 차량 1대 방문(면회), 출입증 3번 발급 후 22:05 반납">' + esc(s.notes) + '</textarea>';
  }else{
    h += s.notes
      ? '<div class="card order-body">' + esc(s.notes) + '</div>'
      : '<div class="small faint">기재 없음</div>';
  }

  /* 서명 / 확정 */
  h += '<div class="sign">' +
    '<div class="sign-box"><div class="role">인계자 (나가는 근무자)</div><div class="nm" id="sign-outName">' + esc(s.outName || '—') + '</div>' +
      '<div class="at">' + (s.handedAt ? fmtStamp(s.handedAt) + ' 인계' : '미확정') + '</div></div>' +
    '<div class="sign-box"><div class="role">인수자 (들어오는 근무자)</div><div class="nm" id="sign-inName">' + esc(s.inName || '—') + '</div>' +
      '<div class="at">' + (s.confirmedAt ? fmtStamp(s.confirmedAt) + ' 확인' : '미확인') + '</div></div>' +
  '</div>';

  h += '<div class="btn-row no-print" style="margin-top:22px">';
  if(editable){
    h += '<button class="btn primary big" data-act="confirm-sheet" data-id="' + s.id + '">✅ 인수인계 완료 처리</button>' +
         '<button class="btn" data-act="print">🖨 인쇄</button>' +
         '<button class="btn danger" data-act="del-sheet" data-id="' + s.id + '">삭제</button>';
  }else{
    h += '<button class="btn" data-act="print">🖨 인쇄</button>' +
         '<button class="btn" data-act="reopen-sheet" data-id="' + s.id + '">🔓 수정 모드로 되돌리기</button>' +
         '<button class="btn danger" data-act="del-sheet" data-id="' + s.id + '">삭제</button>';
  }
  h += '</div>';
  h += '<div class="tiny faint" style="margin-top:14px">작성 ' + fmtStamp(s.createdAt) + ' · 자동 저장됨</div>';
  h += '</div>';
  return h;
}

function f(label, inner){
  return '<div class="field"><label>' + esc(label) + '</label>' + inner + '</div>';
}

/* ---------- 지시사항 목록 ---------- */
function viewOrders(){
  const r = role();
  const all = ordersFor(r.key);
  const filter = state.orderFilter;
  let list = all.filter(o => filter === 'all' ? true : (filter === 'done' ? o.status === 'done' : o.status !== 'done'));
  list.sort((a,b) => (PRIORITY[a.priority].rank - PRIORITY[b.priority].rank) ||
                     (b.relayCount - a.relayCount) || (a.createdAt < b.createdAt ? -1 : 1));
  const stall = stalled(r.key);

  let h = '<div class="page">';
  h += '<div class="page-title"><span class="emoji">📌</span>지시사항</div>';
  h += '<div class="page-desc">간부에게 받은 지시는 여기에 남습니다. <b>완료 처리 전까지 모든 인계서에 자동으로 따라갑니다.</b></div>';

  if(stall.length){
    h += '<div class="callout danger"><span class="cico">🔁</span><div>' +
      '<b>' + stall.length + '건</b>이 3회 이상 인계되었습니다. 처리하거나, 못 하는 이유를 지시한 간부에게 보고하세요.</div></div>';
  }

  h += '<div class="btn-row" style="margin:16px 0 12px">' +
    '<div class="seg">' +
      [['open','미완료'],['done','완료'],['all','전체']].map(([k,l]) =>
        '<button class="' + (filter === k ? 'on' : '') + '" data-act="order-filter" data-val="' + k + '">' + l + '</button>').join('') +
    '</div>' +
    '<div class="spacer"></div>' +
    '<button class="btn primary" data-act="new-order">＋ 지시사항 등록</button>' +
  '</div>';

  if(!list.length){
    h += '<div class="empty"><span class="e">📭</span>' +
      (filter === 'done' ? '완료된 지시사항이 없습니다.' : '등록된 지시사항이 없습니다.') + '</div>';
  }else{
    list.forEach(o => { h += orderCard(o); });
  }
  h += '</div>';
  return h;
}

/* ---------- 지시사항 상세 ---------- */
function viewOrder(){
  const o = getOrder(state.orderId);
  if(!o) return '<div class="page"><div class="empty">지시사항을 찾을 수 없습니다.</div></div>';
  const p = PRIORITY[o.priority] || PRIORITY.normal;
  const st = ORDER_STATUS[o.status] || ORDER_STATUS.open;
  const late = o.due && o.due < todayISO() && o.status !== 'done';

  let h = '<div class="page">';
  h += '<div class="page-title"><span class="emoji">📌</span><span style="flex:1">' + esc(o.title) + '</span></div>';
  h += '<div class="btn-row" style="margin-bottom:18px">' +
    '<span class="tag ' + p.cls + '">' + p.label + '</span>' +
    '<span class="tag ' + st.cls + '">' + st.label + '</span>' +
    (o.relayCount ? '<span class="tag' + (o.relayCount >= 3 ? ' red' : '') + '">🔁 ' + o.relayCount + '회 인계</span>' : '') +
    '<span class="tiny faint">등록 ' + fmtStamp(o.createdAt) + ' · ' + daysSince(o.createdAt) + '일 경과</span>' +
  '</div>';

  if(o.relayCount >= 3 && o.status !== 'done'){
    h += '<div class="callout danger"><span class="cico">⚠️</span><div>' +
      '이 지시는 <b>' + o.relayCount + '번</b> 인계되는 동안 처리되지 않았습니다. ' +
      '지금 처리하거나, 처리가 불가능한 사유를 <b>' + esc(o.from || '지시한 간부') + '</b>에게 보고하고 완료/보류로 정리하세요.</div></div>';
  }

  h += '<div class="sheet-head"><div class="kv">' +
    '<div class="k">지시한 사람</div><div>' + esc(o.from || '-') + '</div>' +
    '<div class="k">대상 직책</div><div>' + (o.role === 'both' ? '위병조장 · 당직병 공통' : esc(ROLES[o.role] ? ROLES[o.role].name : o.role)) + '</div>' +
    '<div class="k">기한</div><div' + (late ? ' style="color:var(--red);font-weight:600"' : '') + '>' +
      (o.due ? esc(fmtDate(o.due)) + (late ? ' · 경과' : '') : '없음') + '</div>' +
  '</div></div>';

  if(o.body) h += '<div class="card order-body">' + esc(o.body) + '</div>';

  h += '<h2 class="sec">상태 변경</h2>';
  h += '<div class="btn-row">' +
    '<div class="seg">' +
      ['open','hold','done'].map(k =>
        '<button class="' + (o.status === k ? 'on' : '') + '" data-act="set-order-status" data-id="' + o.id + '" data-val="' + k + '">' +
        ORDER_STATUS[k].label + '</button>').join('') +
    '</div>' +
    '<button class="btn sm" data-act="edit-order" data-id="' + o.id + '">✏️ 내용 수정</button>' +
    '<button class="btn sm danger" data-act="del-order" data-id="' + o.id + '">삭제</button>' +
  '</div>';

  h += '<h2 class="sec">처리 이력</h2>';
  h += '<div class="timeline">' +
    o.log.slice().reverse().map(l =>
      '<div class="tl-item"><div>' + esc(l.text) + '</div><div class="when">' + fmtStamp(l.at) + '</div></div>').join('') +
  '</div>';

  h += '<div class="btn-row" style="margin-top:10px">' +
    '<input type="text" id="log-note" placeholder="진행 상황 메모 추가" style="max-width:400px">' +
    '<button class="btn sm" data-act="add-log" data-id="' + o.id + '">기록</button></div>';
  h += '</div>';
  return h;
}

/* ---------- 인계 기록 ---------- */
function viewRecords(){
  const r = role();
  const q = state.recordQuery.trim().toLowerCase();
  let list = sheetsFor(r.key);
  if(q){
    list = list.filter(s => {
      const hay = [s.date, s.shift, s.outName, s.inName, s.notes, s.keyMessage]
        .concat(s.checks.map(c => c.text + ' ' + c.note))
        .join(' ').toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }
  let h = '<div class="page">';
  h += '<div class="page-title"><span class="emoji">📚</span>인계 기록</div>';
  h += '<div class="page-desc">' + esc(r.name) + ' 인계서 ' + sheetsFor(r.key).length + '건</div>';
  h += '<div class="btn-row" style="margin-bottom:14px">' +
    '<input type="search" id="rec-q" placeholder="날짜 · 이름 · 내용 검색" value="' + esc(state.recordQuery) + '" style="max-width:340px">' +
    '<div class="spacer"></div>' +
    '<button class="btn primary" data-act="start-handover">✍️ 인계서 작성</button></div>';

  if(!list.length){
    h += '<div class="empty"><span class="e">📭</span>' + (q ? '검색 결과가 없습니다.' : '인계 기록이 없습니다.') + '</div>';
  }else{
    let lastMonth = '';
    list.forEach(s => {
      const m = s.date.slice(0,7);
      if(m !== lastMonth){
        lastMonth = m;
        h += '<h3 class="sub">' + esc(m.replace('-','년 ') + '월') + '</h3>';
      }
      h += sheetRow(s);
    });
  }
  h += '</div>';
  return h;
}

    '<b>2.</b> 교대 30분 전 「인계서 작성」을 눌러 점검 항목을 확인하며 채웁니다.<br>' +

    '<b>4.</b> 인수자와 화면을 같이 보며 확인한 뒤 <b>인수인계 완료 처리</b>를 누릅니다.<br>' +
    '<b>5.</b> 남은 지시는 다음 인계서로 자동 이월되고, 3회 이상 이월되면 경고가 표시됩니다.' +
  '</div>';

/* ---------- 지시사항 등록/수정 모달 ---------- */
function orderModal(existing){

  const body =
    f('지시 내용 (한 줄 요약) *', '<input type="text" id="m-title" placeholder="예) 정문 CCTV 2번 카메라 화면 끊김 — 통신반 보고" value="' + esc(o.title || '') + '">') +
    f('상세 내용', '<textarea id="m-body" placeholder="지시 배경, 조치 방법, 확인해야 할 것 등">' + esc(o.body || '') + '</textarea>') +
    '<div class="grid g2">' +
      f('지시한 사람', '<input type="text" id="m-from" placeholder="예) 당직사령 김○○ 대위" value="' + esc(o.from || '') + '">') +
      f('기한', '<input type="date" id="m-due" value="' + esc(o.due || '') + '">') +
    '</div>' +
    '<div class="grid g2">' +
      f('중요도', '<select id="m-pri">' + Object.keys(PRIORITY).map(k =>
        '<option value="' + k + '"' + ((o.priority || 'normal') === k ? ' selected' : '') + '>' + PRIORITY[k].label + '</option>').join('') + '</select>') +
      f('대상 직책', '<select id="m-role">' +
        '<option value="guard"' + ((o.role || db.activeRole) === 'guard' ? ' selected' : '') + '>위병조장</option>' +
        '<option value="duty"' + ((o.role || db.activeRole) === 'duty' ? ' selected' : '') + '>당직병</option>' +
        '<option value="both"' + (o.role === 'both' ? ' selected' : '') + '>공통 (둘 다)</option>' +
      '</select>') +
    '</div>';
  const foot =
    '<button class="btn" data-act="close-modal">취소</button>' +
    '<button class="btn primary" data-act="save-order" data-id="' + (o.id || '') + '">' + (existing ? '수정' : '등록') + '</button>';
  openModal((existing ? '✏️ 지시사항 수정' : '📌 지시사항 등록'), body, foot, () => {
    const t = $('#m-title'); if(t) t.focus();
  });
}

function saveOrderFromModal(id){
  const data = {
    title: $('#m-title').value,
    body: $('#m-body').value,
    from: $('#m-from').value,
    due: $('#m-due').value,
    priority: $('#m-pri').value,
    role: $('#m-role').value,
  };
  if(!data.title.trim()){ $('#m-title').focus(); toast('지시 내용을 입력하세요.'); return; }
  if(id){
    const o = getOrder(id);
    Object.assign(o, { title:data.title.trim(), body:data.body.trim(), from:data.from.trim(),
                       due:data.due, priority:data.priority, role:data.role });
    logOrder(o, '내용 수정');
    saveDB();
    toast('수정되었습니다.');
  }else{
    addOrder(data);
    toast('지시사항이 등록되었습니다. 완료 전까지 계속 인계됩니다.');
  }
  closeModal();
  render();
}

/* ---------- 백업 ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify(db, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '인수인계_백업_' + todayISO() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('백업 파일을 내려받았습니다.');
}
function importData(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = () => {
    const file = input.files && input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed || !Array.isArray(parsed.sheets) || !Array.isArray(parsed.orders)) throw new Error('형식 오류');
        if(!confirm('현재 데이터를 백업 파일 내용으로 덮어씁니다. 계속할까요?')) return;
        db = normalize(Object.assign(freshDB(), parsed));
        saveDB();
        go('home');
        toast('백업을 불러왔습니다.');
      }catch(e){
        alert('올바른 백업 파일이 아닙니다.');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

/* ============================================================
   이벤트 처리 (위임)
   ============================================================ */
let saveTimer = null;
function saveSoon(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveDB, 350);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el){
    if(isNarrow() && !state.sidebarHidden && !e.target.closest('.sidebar')){
      state.sidebarHidden = true;
      renderSidebar();
    }
    return;
  }
  const act = el.dataset.act;
  const id  = el.dataset.id;
  const val = el.dataset.val;
  const handlers = {
    'go': () => go(el.dataset.view),
    'toggle-sidebar': () => { state.sidebarHidden = !state.sidebarHidden; renderSidebar(); },
    'theme': toggleTheme,
    'print': () => window.print(),
    'close-modal': closeModal,
    'export': exportData,
    'import': importData,

    'switch-role': () => {
      db.activeRole = db.activeRole === 'guard' ? 'duty' : 'guard';
      saveDB();
      go('home');
      toast(role().name + ' 화면으로 전환했습니다.');
    },

    'new-order': () => orderModal(null),
    'save-order': () => saveOrderFromModal(id),
    'edit-order': () => orderModal(getOrder(id)),
    'open-order': () => go('order', { orderId:id }),
    'order-filter': () => { state.orderFilter = val; render(); },

    'set-order-status': () => {
      const o = getOrder(id);
      setOrderStatus(o, val);
      render();
      toast(ORDER_STATUS[val].label + '(으)로 변경했습니다.');
    },
    'add-log': () => {
      const input = $('#log-note');
      const text = input.value.trim();
      if(!text) return;
      const o = getOrder(id);
      logOrder(o, text);
      saveDB();
      render();
    },
    'del-order': () => {
      if(!confirm('이 지시사항을 삭제할까요? 되돌릴 수 없습니다.')) return;
      deleteOrder(id);
      go('orders');
      toast('삭제했습니다.');
    },

    'start-handover': () => {
      const s = newSheet(db.activeRole);
      go('sheet', { sheetId:s.id });
    },
    'open-sheet': () => go('sheet', { sheetId:id }),

    'add-check': () => {
      const input = $('#new-check');
      const text = input.value.trim();
      if(!text) return;
      getSheet(state.sheetId).checks.push({ id:uid(), text:text, ok:false, note:'' });
      saveDB();
      render();
      const n = $('#new-check'); if(n) n.focus();
    },
    'del-check': () => {
      const s = getSheet(state.sheetId);
      s.checks = s.checks.filter(c => c.id !== id);
      saveDB();
      render();
    },
    'order-action': () => {
      const s = getSheet(state.sheetId);
      const info = s.orderNotes[id] || { action:'keep', note:'' };
      info.action = val;
      s.orderNotes[id] = info;
      saveDB();
      const seg = el.parentElement;
      Array.prototype.forEach.call(seg.children, b => b.classList.toggle('on', b.dataset.val === val));
    },
    'confirm-sheet': () => {
      const s = getSheet(id);
      if(!s.outName.trim() || !s.inName.trim()){
        toast('인계자와 인수자 이름을 먼저 입력하세요.');
        return;
      }
      const unchecked = s.checks.filter(c => !c.ok).length;
      const keeping = s.orderIds.filter(oid => {
        const o = getOrder(oid);
        return o && o.status !== 'done' && (s.orderNotes[oid] || {}).action !== 'done';
      }).length;
      let msg = '인수인계를 완료 처리할까요?\n\n';
      if(unchecked) msg += '· 미확인 점검 항목 ' + unchecked + '개\n';
      msg += '· 다음 근무자에게 넘어가는 지시사항 ' + keeping + '건\n\n완료 후에는 수정 모드로 되돌려야 편집할 수 있습니다.';
      if(!confirm(msg)) return;
      confirmSheet(s);
      render();
      toast('인수인계가 기록되었습니다.');
    },
    'reopen-sheet': () => {
      const s = getSheet(id);
      if(!confirm('수정 모드로 되돌립니다. 이미 반영된 지시사항 인계 횟수는 되돌아가지 않습니다.')) return;
      s.status = 'draft';
      saveDB();
      render();
    },
    'del-sheet': () => {
      if(!confirm('이 인계서를 삭제할까요? 되돌릴 수 없습니다.')) return;
      deleteSheet(id);
      go('records');
      toast('삭제했습니다.');
    },

    'add-tpl': () => {
      const input = $('#new-tpl');
      const text = input.value.trim();
      if(!text) return;
      db.templates[db.activeRole].push(text);
      saveDB();
      render();
      const n = $('#new-tpl'); if(n) n.focus();
    },
    'del-tpl': () => {
      db.templates[db.activeRole].splice(parseInt(el.dataset.idx,10), 1);
      saveDB();
      render();
    },
    'reset-tpl': () => {
      if(!confirm('기본 점검 항목으로 되돌릴까요? 수정한 내용은 사라집니다.')) return;
      db.templates[db.activeRole] = DEFAULT_TEMPLATES[db.activeRole].slice();
      saveDB();
      render();
    },
    'wipe': () => {
      if(!confirm('저장된 모든 인계서와 지시사항을 삭제합니다. 계속할까요?')) return;
      if(!confirm('정말 삭제할까요? 되돌릴 수 없습니다. 먼저 백업을 받는 것을 권장합니다.')) return;
      db = freshDB();
      saveDB();
      go('home');
      toast('모든 데이터를 삭제했습니다.');
    },
  };
  if(handlers[act]){ e.preventDefault(); handlers[act](); }
});

/* 입력 반영 — 텍스트는 다시 그리지 않고 모델만 갱신해 포커스를 유지합니다. */
document.addEventListener('input', e => {
  const el = e.target;
  const spec = el.dataset.in;
  if(spec === undefined){
    if(el.id === 'rec-q'){
      state.recordQuery = el.value;
      render();
      const q = $('#rec-q');
      if(q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    }
    return;
  }
  const parts = spec.split(':');
  const kind = parts[0];

  if(kind === 'sheet'){
    const s = getSheet(state.sheetId);
    if(!s) return;
    s[parts[1]] = el.value;
    if(parts[1] === 'outName' || parts[1] === 'inName'){
      const box = $('#sign-' + parts[1]);       /* 서명란을 즉시 갱신 */
      if(box) box.textContent = el.value || '—';
    }
    saveSoon();
  }else if(kind === 'check'){
    const s = getSheet(state.sheetId);
    if(!s) return;
    const c = s.checks.find(x => x.id === parts[1]);
    if(!c) return;
    if(parts[2] === 'ok'){
      c.ok = el.checked;
      el.closest('.check').classList.toggle('done', c.ok);
      const cnt = $('#check-count');
      if(cnt) cnt.textContent = s.checks.filter(x => x.ok).length + '/' + s.checks.length;
    }else{
      c.note = el.value;
    }
    saveSoon();
  }else if(kind === 'ordernote'){
    const s = getSheet(state.sheetId);
    if(!s) return;
    const info = s.orderNotes[parts[1]] || { action:'keep', note:'' };
    info.note = el.value;
    s.orderNotes[parts[1]] = info;
    saveSoon();
  }else if(kind === 'db'){
    if(parts[1] === 'shifts'){
      db.shifts = el.value.split('\n').map(x => x.trim()).filter(Boolean);
    }else{
      db[parts[1]] = el.value;
    }
    saveSoon();
  }else if(kind === 'tpl'){
    db.templates[db.activeRole][parseInt(parts[1],10)] = el.value;
    saveSoon();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.in && el.type === 'checkbox') return; /* input 이벤트에서 처리됨 */
  if(el.dataset.in && (el.tagName === 'SELECT' || el.type === 'date')){
    /* select/date 는 input 이벤트로도 들어오지만 일부 브라우저 대비 */
    el.dispatchEvent(new Event('input', { bubbles:true }));
  }
});

/* Enter 로 빠르게 추가 */
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  const id = e.target.id;
  if(id === 'new-check')      $('[data-act="add-check"]').click();
  else if(id === 'new-tpl')   $('[data-act="add-tpl"]').click();
  else if(id === 'log-note')  $('[data-act="add-log"]').click();
  else if(id === 'm-title' || id === 'm-from'){
    const btn = $('[data-act="save-order"]');
    if(btn) btn.click();
  }
});

/* ---------- 첫 실행 안내 ---------- */
function welcome(){
  const body =
    '<p class="small muted" style="margin-bottom:16px">' +
      '이 프로그램은 인터넷 없이 이 컴퓨터에서만 동작합니다. 처음 한 번만 설정하면 됩니다.</p>' +
    f('부대 / 소속 표기', '<input type="text" id="w-unit" placeholder="예) ○○연대 1대대">') +
    f('먼저 사용할 직책', '<select id="w-role"><option value="guard">🛡️ 위병조장</option><option value="duty">🌙 당직병</option></select>') +
    '<div class="callout info small" style="margin-top:6px"><span class="cico">📌</span><div>' +
      '핵심 규칙 하나 — <b>간부에게 지시를 받으면 그 자리에서 「지시사항」으로 등록하세요.</b> ' +
      '완료 처리 전까지 모든 인계서에 자동으로 따라가므로, 같은 지시를 두 번 받을 일이 없어집니다.</div></div>';
  openModal('👋 근무 인수인계 시작하기', body,
    '<button class="btn primary" id="w-ok">시작하기</button>', () => {
    const go2 = () => {
      db.unit = $('#w-unit').value.trim();
      db.activeRole = $('#w-role').value;
      saveDB();
      closeModal();
      render();
    };
    $('#w-ok').addEventListener('click', go2);
    $('#w-unit').addEventListener('keydown', ev => { if(ev.key === 'Enter') go2(); });
    $('#w-unit').focus();
  });
}

/* ---------- 시작 ---------- */
(function init(){
  db = loadDB();
  let theme = 'light';
  try{ theme = localStorage.getItem(THEME_KEY) || 'light'; }catch(e){}
  applyTheme(theme);
  state.sidebarHidden = isNarrow();
  render();
  window.addEventListener('resize', () => {
    const narrow = isNarrow();
    if(!narrow && state.sidebarHidden){ state.sidebarHidden = false; renderSidebar(); }
  });
  if(!db.unit && !db.sheets.length && !db.orders.length) welcome();
  window.addEventListener('beforeunload', () => { clearTimeout(saveTimer); saveDB(); });
})();
</script>
